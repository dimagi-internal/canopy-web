AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  A canopy cloud runner's zero-knowledge ECDH key (canopy-web#1550) — its own small
  stack beside the runner's, so adding or rotating it never touches the instance (a
  runner-stack update re-resolves the AMI parameter and REPLACES the box). up.sh deploys
  it as <runner stack>-ecdh after the runner stack; down.sh deletes it first.

Parameters:
  RunnerRoleArn:
    Type: String
    Description: The runner stack's RunnerRole ARN — the only principal that may derive.
  # Several runners on one machine (docs/architecture/runners.md): every runner other
  # than the one named as the machine gets its OWN key, so a runner's agents are wrapped
  # to a key no other runner can use (the machine's root-only broker derives for each
  # runner with its own key only). The machine's own runner keeps EcdhKey below — the
  # key a machine moved to several runners already had — so no existing wrap breaks.
  # Four slots: CloudFormation has no loop that survives an empty list.
  Runner1:
    Type: String
    Default: ''
    AllowedPattern: '^([a-z0-9][a-z0-9-]{0,27})?$'
    Description: A runner's id on this machine (e.g. marshellis, agent-eva) — its own ECDH key. '' = none.
  Runner2:
    Type: String
    Default: ''
    AllowedPattern: '^([a-z0-9][a-z0-9-]{0,27})?$'
    Description: A runner's id on this machine (e.g. marshellis, agent-eva) — its own ECDH key. '' = none.
  Runner3:
    Type: String
    Default: ''
    AllowedPattern: '^([a-z0-9][a-z0-9-]{0,27})?$'
    Description: A runner's id on this machine (e.g. marshellis, agent-eva) — its own ECDH key. '' = none.
  Runner4:
    Type: String
    Default: ''
    AllowedPattern: '^([a-z0-9][a-z0-9-]{0,27})?$'
    Description: A runner's id on this machine (e.g. marshellis, agent-eva) — its own ECDH key. '' = none.

Conditions:
  HasRunner1: !Not [!Equals [!Ref Runner1, '']]
  HasRunner2: !Not [!Equals [!Ref Runner2, '']]
  HasRunner3: !Not [!Equals [!Ref Runner3, '']]
  HasRunner4: !Not [!Equals [!Ref Runner4, '']]

Resources:
  # The box's zero-knowledge ECDH key (canopy-web#1550): the key a ZK agent's
  # vault key is wrapped to. A Mac keeps it in its Secure Enclave; an EC2 box
  # has none, so it lives here — P-256 KEY_AGREEMENT, and ONLY this runner's
  # instance role may derive with it (canopy src/orchestrator/device_key_kms.py
  # finds it by the alias below). The account root may administer the key but
  # not derive: kms:DeriveSharedSecret is deliberately absent from its grant.
  EcdhKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub '${AWS::StackName} zero-knowledge vault ECDH key (canopy-web#1550)'
      KeySpec: ECC_NIST_P256
      KeyUsage: KEY_AGREEMENT
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministersButCannotDerive
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action:
              - kms:Create*
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
            Resource: '*'
          - Sid: OnlyThisRunnerDerives
            Effect: Allow
            Principal: { AWS: !Ref RunnerRoleArn }
            Action:
              - kms:DeriveSharedSecret
              - kms:GetPublicKey
            Resource: '*'
      Tags:
        - { Key: purpose, Value: canopy-cloud-runner }

  EcdhKeyAlias:
    Type: AWS::KMS::Alias
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # The box finds its key by its instance role's NAME (from IMDS), so the alias
      # is that name: the last path segment of the role ARN.
      AliasName: !Sub
        - 'alias/canopy-runner-ecdh/${RoleName}'
        - RoleName: !Select [1, !Split ['/', !Ref RunnerRoleArn]]
      TargetKeyId: !Ref EcdhKey

  # The resources keep the logical IDs they were created under (Unit<i>Key,
  # Unit<i>KeyAlias): a new logical ID is a NEW key in CloudFormation, and every vault
  # wrap to the old one would be lost. Only the parameters, conditions and outputs
  # around them say "runner".
  Unit1Key:
    Type: AWS::KMS::Key
    Condition: HasRunner1
    # A runner's agents' vault keys are wrapped to this key: removing the runner from the
    # stack (or a slot change) must never schedule it for deletion.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub '${AWS::StackName} runner ${Runner1} zero-knowledge vault ECDH key'
      KeySpec: ECC_NIST_P256
      KeyUsage: KEY_AGREEMENT
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministersButCannotDerive
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action:
              - kms:Create*
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
            Resource: '*'
          - Sid: OnlyThisRunnerDerives
            Effect: Allow
            Principal: { AWS: !Ref RunnerRoleArn }
            Action:
              - kms:DeriveSharedSecret
              - kms:GetPublicKey
            Resource: '*'
      Tags:
        - { Key: purpose, Value: canopy-cloud-runner }
        - { Key: runner, Value: !Ref Runner1 }

  Unit1KeyAlias:
    Type: AWS::KMS::Alias
    Condition: HasRunner1
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # cloud_runner.runner_kms_key: alias/canopy-runner-ecdh/<role name>/<the runner's id>.
      AliasName: !Sub
        - 'alias/canopy-runner-ecdh/${RoleName}/${Runner1}'
        - RoleName: !Select [1, !Split ['/', !Ref RunnerRoleArn]]
      TargetKeyId: !Ref Unit1Key

  Unit2Key:
    Type: AWS::KMS::Key
    Condition: HasRunner2
    # A runner's agents' vault keys are wrapped to this key: removing the runner from the
    # stack (or a slot change) must never schedule it for deletion.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub '${AWS::StackName} runner ${Runner2} zero-knowledge vault ECDH key'
      KeySpec: ECC_NIST_P256
      KeyUsage: KEY_AGREEMENT
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministersButCannotDerive
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action:
              - kms:Create*
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
            Resource: '*'
          - Sid: OnlyThisRunnerDerives
            Effect: Allow
            Principal: { AWS: !Ref RunnerRoleArn }
            Action:
              - kms:DeriveSharedSecret
              - kms:GetPublicKey
            Resource: '*'
      Tags:
        - { Key: purpose, Value: canopy-cloud-runner }
        - { Key: runner, Value: !Ref Runner2 }

  Unit2KeyAlias:
    Type: AWS::KMS::Alias
    Condition: HasRunner2
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # cloud_runner.runner_kms_key: alias/canopy-runner-ecdh/<role name>/<the runner's id>.
      AliasName: !Sub
        - 'alias/canopy-runner-ecdh/${RoleName}/${Runner2}'
        - RoleName: !Select [1, !Split ['/', !Ref RunnerRoleArn]]
      TargetKeyId: !Ref Unit2Key

  Unit3Key:
    Type: AWS::KMS::Key
    Condition: HasRunner3
    # A runner's agents' vault keys are wrapped to this key: removing the runner from the
    # stack (or a slot change) must never schedule it for deletion.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub '${AWS::StackName} runner ${Runner3} zero-knowledge vault ECDH key'
      KeySpec: ECC_NIST_P256
      KeyUsage: KEY_AGREEMENT
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministersButCannotDerive
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action:
              - kms:Create*
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
            Resource: '*'
          - Sid: OnlyThisRunnerDerives
            Effect: Allow
            Principal: { AWS: !Ref RunnerRoleArn }
            Action:
              - kms:DeriveSharedSecret
              - kms:GetPublicKey
            Resource: '*'
      Tags:
        - { Key: purpose, Value: canopy-cloud-runner }
        - { Key: runner, Value: !Ref Runner3 }

  Unit3KeyAlias:
    Type: AWS::KMS::Alias
    Condition: HasRunner3
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # cloud_runner.runner_kms_key: alias/canopy-runner-ecdh/<role name>/<the runner's id>.
      AliasName: !Sub
        - 'alias/canopy-runner-ecdh/${RoleName}/${Runner3}'
        - RoleName: !Select [1, !Split ['/', !Ref RunnerRoleArn]]
      TargetKeyId: !Ref Unit3Key

  Unit4Key:
    Type: AWS::KMS::Key
    Condition: HasRunner4
    # A runner's agents' vault keys are wrapped to this key: removing the runner from the
    # stack (or a slot change) must never schedule it for deletion.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub '${AWS::StackName} runner ${Runner4} zero-knowledge vault ECDH key'
      KeySpec: ECC_NIST_P256
      KeyUsage: KEY_AGREEMENT
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministersButCannotDerive
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action:
              - kms:Create*
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
            Resource: '*'
          - Sid: OnlyThisRunnerDerives
            Effect: Allow
            Principal: { AWS: !Ref RunnerRoleArn }
            Action:
