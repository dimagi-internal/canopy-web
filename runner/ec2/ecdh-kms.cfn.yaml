Outputs:
  EcdhKeyArn:
    Value: !GetAtt EcdhKey.Arn
  EcdhKeyAlias:
    Value: !Ref EcdhKeyAlias
  Runner1KeyArn:
    Condition: HasRunner1
    Value: !GetAtt Unit1Key.Arn
  Runner2KeyArn:
    Condition: HasRunner2
    Value: !GetAtt Unit2Key.Arn
  Runner3KeyArn:
    Condition: HasRunner3
    Value: !GetAtt Unit3Key.Arn
  Runner4KeyArn:
    Condition: HasRunner4
    Value: !GetAtt Unit4Key.Arn
