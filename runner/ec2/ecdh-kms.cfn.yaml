Outputs:
  EcdhKeyArn:
    Value: !GetAtt EcdhKey.Arn
  EcdhKeyAlias:
    Value: !Ref EcdhKeyAlias
  Unit1KeyArn:
    Condition: HasUnit1
    Value: !GetAtt Unit1Key.Arn
  Unit2KeyArn:
    Condition: HasUnit2
    Value: !GetAtt Unit2Key.Arn
  Unit3KeyArn:
    Condition: HasUnit3
    Value: !GetAtt Unit3Key.Arn
  Unit4KeyArn:
    Condition: HasUnit4
    Value: !GetAtt Unit4Key.Arn
