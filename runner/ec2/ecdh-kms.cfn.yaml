AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  A canopy cloud runner's zero-knowledge ECDH key (canopy-web#1550) — its own small
  stack beside the runner's, so adding or rotating it never touches the instance (a
  runner-stack update re-resolves the AMI parameter and REPLACES the box). up.sh deploys
  it as <runner stack>-ecdh after the runner stack; down.sh deletes it first.

Parameters:
  RunnerRoleArn:
    Type: String
    Description: The runner stack's RunnerRole ARN — the only principal that may derive.
  # Isolation units (spec 2026-10-19-runner-isolation-units §2): every unit other than
  # the one named as the box gets its OWN key, so a unit's agents are wrapped to a key
  # no other unit can use (the box's root-only broker derives for each unit with its
  # own key only). The box's own unit keeps EcdhKey below — the key a box moved to
  # units already had — so no existing wrap breaks. Four slots: CloudFormation has no
  # loop that survives an empty list.
  Unit1:
    Type: String
    Default: ''
    AllowedPattern: '^([a-z0-9][a-z0-9-]{0,27})?$'
    Description: An isolation unit's id (e.g. marshellis, agent-eva) — its own ECDH key. '' = none.
  Unit2:
    Type: String
    Default: ''
    AllowedPattern: '^([a-z0-9][a-z0-9-]{0,27})?$'
    Description: An isolation unit's id (e.g. marshellis, agent-eva) — its own ECDH key. '' = none.
  Unit3:
    Type: String
    Default: ''
    AllowedPattern: '^([a-z0-9][a-z0-9-]{0,27})?$'
    Description: An isolation unit's id (e.g. marshellis, agent-eva) — its own ECDH key. '' = none.
  Unit4:
    Type: String
    Default: ''
    AllowedPattern: '^([a-z0-9][a-z0-9-]{0,27})?$'
    Description: An isolation unit's id (e.g. marshellis, agent-eva) — its own ECDH key. '' = none.

Conditions:
  HasUnit1: !Not [!Equals [!Ref Unit1, '']]
  HasUnit2: !Not [!Equals [!Ref Unit2, '']]
  HasUnit3: !Not [!Equals [!Ref Unit3, '']]
  HasUnit4: !Not [!Equals [!Ref Unit4, '']]

Resources:
  # The box's zero-knowledge ECDH key (canopy-web#1550): the key a ZK agent's
  # vault key is wrapped to. A Mac keeps it in its Secure Enclave; an EC2 box
  # has none, so it lives here — P-256 KEY_AGREEMENT, and ONLY this runner's
  # instance role may derive with it (canopy src/orchestrator/device_key_kms.py
  # finds it by the alias below). The account root may administer the key but
  # not derive: kms:DeriveSharedSecret is deliberately absent from its grant.
  EcdhKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub '${AWS::StackName} zero-knowledge vault ECDH key (canopy-web#1550)'
      KeySpec: ECC_NIST_P256
      KeyUsage: KEY_AGREEMENT
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministersButCannotDerive
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action:
              - kms:Create*
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
            Resource: '*'
          - Sid: OnlyThisRunnerDerives
            Effect: Allow
            Principal: { AWS: !Ref RunnerRoleArn }
            Action:
              - kms:DeriveSharedSecret
              - kms:GetPublicKey
            Resource: '*'
      Tags:
        - { Key: purpose, Value: canopy-cloud-runner }

  EcdhKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      # The box finds its key by its instance role's NAME (from IMDS), so the alias
      # is that name: the last path segment of the role ARN.
      AliasName: !Sub
        - 'alias/canopy-runner-ecdh/${RoleName}'
        - RoleName: !Select [1, !Split ['/', !Ref RunnerRoleArn]]
      TargetKeyId: !Ref EcdhKey

  Unit1Key:
    Type: AWS::KMS::Key
    Condition: HasUnit1
    Properties:
      Description: !Sub '${AWS::StackName} unit ${Unit1} zero-knowledge vault ECDH key'
      KeySpec: ECC_NIST_P256
      KeyUsage: KEY_AGREEMENT
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministersButCannotDerive
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action:
              - kms:Create*
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
            Resource: '*'
          - Sid: OnlyThisRunnerDerives
            Effect: Allow
            Principal: { AWS: !Ref RunnerRoleArn }
            Action:
              - kms:DeriveSharedSecret
              - kms:GetPublicKey
            Resource: '*'
      Tags:
        - { Key: purpose, Value: canopy-cloud-runner }
        - { Key: unit, Value: !Ref Unit1 }

  Unit1KeyAlias:
    Type: AWS::KMS::Alias
    Condition: HasUnit1
    Properties:
      # cloud_runner.unit_kms_key: alias/canopy-runner-ecdh/<role name>/<unit id>.
      AliasName: !Sub
        - 'alias/canopy-runner-ecdh/${RoleName}/${Unit1}'
        - RoleName: !Select [1, !Split ['/', !Ref RunnerRoleArn]]
      TargetKeyId: !Ref Unit1Key

  Unit2Key:
    Type: AWS::KMS::Key
    Condition: HasUnit2
    Properties:
      Description: !Sub '${AWS::StackName} unit ${Unit2} zero-knowledge vault ECDH key'
      KeySpec: ECC_NIST_P256
      KeyUsage: KEY_AGREEMENT
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministersButCannotDerive
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action:
              - kms:Create*
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
            Resource: '*'
          - Sid: OnlyThisRunnerDerives
            Effect: Allow
            Principal: { AWS: !Ref RunnerRoleArn }
            Action:
              - kms:DeriveSharedSecret
              - kms:GetPublicKey
            Resource: '*'
      Tags:
        - { Key: purpose, Value: canopy-cloud-runner }
        - { Key: unit, Value: !Ref Unit2 }

  Unit2KeyAlias:
    Type: AWS::KMS::Alias
    Condition: HasUnit2
    Properties:
      # cloud_runner.unit_kms_key: alias/canopy-runner-ecdh/<role name>/<unit id>.
      AliasName: !Sub
        - 'alias/canopy-runner-ecdh/${RoleName}/${Unit2}'
        - RoleName: !Select [1, !Split ['/', !Ref RunnerRoleArn]]
      TargetKeyId: !Ref Unit2Key

  Unit3Key:
    Type: AWS::KMS::Key
    Condition: HasUnit3
    Properties:
      Description: !Sub '${AWS::StackName} unit ${Unit3} zero-knowledge vault ECDH key'
      KeySpec: ECC_NIST_P256
      KeyUsage: KEY_AGREEMENT
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministersButCannotDerive
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action:
              - kms:Create*
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
            Resource: '*'
          - Sid: OnlyThisRunnerDerives
            Effect: Allow
            Principal: { AWS: !Ref RunnerRoleArn }
            Action:
              - kms:DeriveSharedSecret
              - kms:GetPublicKey
            Resource: '*'
      Tags:
        - { Key: purpose, Value: canopy-cloud-runner }
        - { Key: unit, Value: !Ref Unit3 }

  Unit3KeyAlias:
    Type: AWS::KMS::Alias
    Condition: HasUnit3
    Properties:
      # cloud_runner.unit_kms_key: alias/canopy-runner-ecdh/<role name>/<unit id>.
      AliasName: !Sub
        - 'alias/canopy-runner-ecdh/${RoleName}/${Unit3}'
        - RoleName: !Select [1, !Split ['/', !Ref RunnerRoleArn]]
      TargetKeyId: !Ref Unit3Key

  Unit4Key:
    Type: AWS::KMS::Key
    Condition: HasUnit4
    Properties:
      Description: !Sub '${AWS::StackName} unit ${Unit4} zero-knowledge vault ECDH key'
      KeySpec: ECC_NIST_P256
      KeyUsage: KEY_AGREEMENT
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministersButCannotDerive
            Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action:
              - kms:Create*
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
            Resource: '*'
          - Sid: OnlyThisRunnerDerives
            Effect: Allow
            Principal: { AWS: !Ref RunnerRoleArn }
            Action:
              - kms:DeriveSharedSecret
              - kms:GetPublicKey
            Resource: '*'
      Tags:
        - { Key: purpose, Value: canopy-cloud-runner }
        - { Key: unit, Value: !Ref Unit4 }

  Unit4KeyAlias:
    Type: AWS::KMS::Alias
    Condition: HasUnit4
