AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Canopy cloud runner (Wave 4 SP2b) — an ephemeral EC2 instance that pairs a
  kind=cloud runner with canopy-web, claims harness Turns in its capabilities, and
  runs `claude -p` on each — as one or more isolation units (RunnerUnits), each its
  own Unix user, runner and device key, with IMDS closed to all but root. The box
  holds no PAT, no Claude token and no box-wide keyring password. cloud_runner.py's
  first-boot seed is delivered via Secrets Manager (up.sh publishes it there as a
  manifest + parts); single source of truth is runner/ec2/cloud_runner.py.

Parameters:
  SshCidr:
    Type: String
    Description: CIDR allowed to SSH (the launcher's IP/32).
  InstanceType:
    Type: String
    Default: t3.medium
  Ami:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
  CanopyBaseUrl:
    Type: String
    Default: https://canopy.dimagi.com
  RunnerProjects:
    Type: String
    Default: canopy-web
    Description: Comma-separated repo names this runner may drive.
  RunnerAgents:
    Type: String
    Default: ''
    Description: Comma-separated agent slugs this runner may drive.
  RunnerDataMode:
    Type: String
    AllowedValues: ['', 'zdr']
    Default: ''
    Description: >
      `zdr` puts the box in ZDR mode: Claude runs only on the credential bundle's
      API-key slot (a key from an Anthropic organisation with zero data
      retention), every turn runs under a locked permission profile, and the
      box reports the mode on every heartbeat so a person's `zdr` declaration
      is in force. See docs/superpowers/specs/2026-10-22-phi-agents-on-zdr-runners-design.md.
      ZDR mode needs RunnerEgress=locked.
  RunnerEgress:
    Type: String
    AllowedValues: ['', 'locked']
    Default: ''
    Description: >
      `locked`: the box's isolation units reach the network only through a local
      proxy that admits an allowlist of hostnames on 443 (canopy-web, the model,
      GitHub, plus RunnerEgressAllow); root's iptables chain rejects the rest,
      DNS included. Any box may lock its egress; ZDR mode requires it.
  RunnerEgressAllow:
    Type: String
    Default: ''
    Description: >
      Extra hostnames a locked box admits, comma-separated; `.example.com` admits
      every subdomain. Ignored unless RunnerEgress=locked.
  RunnerExecutor:
    Type: String
    AllowedValues: ['cli', 'acp']
    Default: 'acp'
    Description: >
      Which executor runs a turn: `cli` spawns `claude -p` and parses
      stream-json; `acp` drives @agentclientprotocol/claude-agent-acp over
      JSON-RPC. ACP is the standard that specifies what the cli path hand-rolls,
      and it is the only one of the two that can offer steering, interrupt and
      permission prompts (spec 2026-07-27-acp-adoption-design).

      Defaulted to `acp` rather than left off, for two reasons. It is safe by
      construction — `run_acp` falls back to `claude -p` whenever the adapter is
      missing, so a box without it degrades instead of failing. And a default of
      `cli` here would SILENTLY revert a box someone had switched on, the next
      time anyone ran up.sh: up.sh overrides only SshCidr, so every other
      parameter falls back to its default on every stack update.

      Verified on cloud-ec2-1, 2026-09-09: tool_start/tool_end/assistant events
      arrive in the ledger's existing shapes, `toolCallId` matching the
      transcript's tool_use.id, with rawInput populated.
  RunnerDirected:
    Type: String
    AllowedValues: ['0', '1']
    Default: '0'
    Description: >
      '1' makes this a directed-only box (capabilities.directed): it claims only
      turns pinned to it and turns of chats bound to it, never routed agent work,
      repo turns, unbound chats or an inherited workspace order. For a test box
      (`up.sh --test`); a chat started on it binds to it.
  RunnerSessions:
    Type: String
    AllowedValues: ['0', '1']
    Default: '1'
    Description: >
      Whether this runner declares capabilities.sessions and may therefore claim
      chat/session-targeted turns — including the ace-web runs delegated to
      canopy's harness, which are session-targeted by construction and are the
      reason this box exists (spec 2026-07-27 source-aware runner routing).

      Default ON as of 2026-07-28, once the durable-record path was verified end
      to end on this box: a session turn now ships its transcript rows via
      /runners/{id}/session-stream and lands ordinal-keyed Message rows, and
      resumes its CLI session across turns. Two server-side defects had to be
      fixed first — the WS claim frame dropped origin_ref (so the runner could
      not tell a session turn was one), and the in-repo packages were installed
      by a method this AMI cannot run, so canopy_transcript was never importable.

      Still NOT implemented here: /runners/{id}/streams + /backfills, so a
      viewer attached mid-turn sees the reduced TurnEvent stream rather than a
      live transcript tail, and a server-requested backfill is ignored. History
      is not lost by either — the transcript ships at turn end regardless.
  AgentSlugs:
    Type: String
    Default: 'ace,ada,echo,eva,hal'
    Description: >
      Comma-separated agent slugs to BOOTSTRAP on this box (clone + `canopy
      provision` + gmail token) — runner/ec2/bootstrap_agents.sh's
      AGENT_SLUGS. Distinct from RunnerAgents: this is what gets PROVISIONED
      here; RunnerAgents is what this runner may CLAIM turns for. Usually the
      same set, but a box can bootstrap the whole fleet while only claiming a
      subset (or vice versa, if bootstrap fails for one agent).
  RunnerUnits:
    Type: String
    Default: ''
    AllowedPattern: '^((tree|agent):[a-z0-9][a-z0-9@-]*)?(,(tree|agent):[a-z0-9][a-z0-9@-]*)*$'
    Description: >
      The box's isolation units (spec 2026-10-19-runner-isolation-units §1), e.g.
      `tree:dimagi,tree:marshellis,agent:eva` — each its own Unix user (cu-<unit>),
      runner (canopy-runner@<unit>), Runner row and device key. Empty = ONE unit,
      `tree:<RunnerWorkspace>`, named <RunnerName> — so a single-tree box keeps its
      shape and its runner. Every other unit is <RunnerName>-<unit>. An agent unit
      for <slug> needs its ECDH key in the -ecdh stack (up.sh --units passes it).
  RunnerWorkspace:
    Type: String
    Default: dimagi
  RunnerName:
    Type: String
    Default: cloud-ec2-1
  RunnerSeedSecret:
    Type: String
    Default: canopy/cloud-runner/runner-seed
    Description: >
      Secrets Manager id of the FIRST-BOOT SEED of cloud_runner.py, published by
      up.sh (runner/ec2/seed.py): a JSON manifest {format, parts, sha256, sha,
      committed_at} plus N parts named `<this id>-part-<i>`, each a slice of the
      file as gzip+base64. Concatenated, decoded and sha256-checked on the box.

      Parts rather than one value because Secrets Manager caps a value at 65536
      bytes and the runner outgrew it (2026-10-04: 91 KB encoded), which made
      up.sh fail on every run. The code is not in UserData either: EC2 caps
      UserData at 16 KB. The manifest also carries the seed's provenance (what
      the old runner-code-sha secret held), so a fresh box's first auto-update
      check is a real answer instead of `unknown`.

      A seed, not the update channel: canopy-fetch-env installs it only when
      there is no cloud_runner.py on disk. Past that the auto-updater owns the
      file and tracks the DEPLOYED sha. `canopy-runner-update --from-secret` is
      the deliberate way back to these bytes.

      Stacks created before 2026-10-04 read the legacy single-value secrets
      canopy/cloud-runner/runner-code + runner-code-sha instead; up.sh no longer
      writes those, so they stay exactly as such a box last read them.
  VolumeSize:
    Type: Number
    Default: 40
    MinValue: 20
    Description: >
      Root EBS volume, GiB. 20 filled to 100% on cloud-ec2-1 (2026-10-04): the
      plugin cache kept every version it had ever installed (33 canopy, 24 ace,
      ~9 GB) on top of npm/uv caches and eight agent clones. bootstrap_agents.sh
      now prunes those caches; this is the headroom. Changing it on an existing
      stack REPLACES the instance (a new runner row; re-run wire.sh).

Resources:
  KeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Sub '${AWS::StackName}-key'

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'canopy cloud runner ${AWS::StackName} (SSH from launcher only)'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshCidr
      Tags:
        - { Key: Name, Value: !Ref AWS::StackName }
        - { Key: purpose, Value: canopy-cloud-runner }

  RunnerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: read-runner-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:canopy/cloud-runner/*'

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [ !Ref RunnerRole ]

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref Ami
      KeyName: !Ref KeyPair
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [ !Ref SecurityGroup ]
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: { VolumeSize: !Ref VolumeSize, VolumeType: gp3 }
      Tags:
        - { Key: Name, Value: !Ref AWS::StackName }
        - { Key: purpose, Value: canopy-cloud-runner }
      # DEPLOY GAP (still real for THIS block): CFN applies a UserData change as a
      # stop/start of the SAME instance, which does NOT re-run cloud-init
      # (cloud-init only runs write_files/runcmd on an instance's first boot). So
      # editing anything baked in below and redeploying does NOT ship it to a
      # running box — recycle (`./down.sh --keep-runner && ./up.sh && ./wire.sh`).
      # cloud_runner.py is EXEMPT: it is seeded from Secrets Manager on first boot
      # and then kept current by the auto-updater (canopy-runner-update.timer).
      # Keep this block small — the whole rendered UserData must stay under EC2's
      # hard 16 KB cap (tests/test_seed_roundtrip.py measures it).
      UserData:
        Fn::Base64: !Sub |
          #cloud-config
          write_files:
            - path: /usr/local/bin/canopy-fetch-env
              permissions: '0755'
              content: |
                #!/usr/bin/env bash
                # Re-materialize box.env (the stack's parameters, no secret) on every
                # start of canopy-units.service — and, on FIRST boot only, install the
                # runner code seed (below).
                set -euo pipefail
                R="${AWS::Region}"
                secret() { aws --region "$R" secretsmanager get-secret-value --secret-id "$1" --query SecretString --output text; }
                umask 077
                install -d -o root -g root /opt/canopy-runner
                # cloud_runner.py lives in Secrets Manager, not UserData (16 KB cap).
                # SEED ONLY — install it when there is nothing on disk, and never
                # again. Past first boot the auto-updater owns this file and tracks
                # the DEPLOYED sha; re-fetching here on every start would revert
                # every update at the next restart, silently, forever.
                # `canopy-runner-update --from-secret` is the deliberate way back.
                # Decode to a temp file and mv into place so a failed fetch can never
                # leave a truncated script that systemd would then try to exec. The
                # stamp (build-info.json) is the seed's provenance, from the
                # manifest, so the first update check can answer at all.
                if [ ! -s /opt/canopy-runner/cloud_runner.py ]; then
                  # Manifest + parts (runner/ec2/seed.py): Secrets Manager caps a
                  # value at 64 KB and the runner outgrew one. The sha256 check
                  # turns a publish caught half-way into a failed start that
                  # systemd retries, never a box running mixed bytes.
                  SEED=/opt/canopy-runner/seed
                  rm -rf "$SEED"; install -d -m 700 "$SEED"
                  secret ${RunnerSeedSecret} > "$SEED/manifest.json"
                  N=$(python3 -c 'import json,sys; print(int(json.load(open(sys.argv[1]))["parts"]))' "$SEED/manifest.json")
                  for i in $(seq 0 $((N - 1))); do
                    secret "${RunnerSeedSecret}-part-$i" >> "$SEED/code.b64"
                  done
                  base64 -d < "$SEED/code.b64" | gunzip > /opt/canopy-runner/cloud_runner.py.new
                  python3 - "$SEED/manifest.json" /opt/canopy-runner/cloud_runner.py.new /opt/canopy-runner/build-info.json <<'PY'
                import hashlib, json, sys
                m = json.load(open(sys.argv[1]))
                if hashlib.sha256(open(sys.argv[2], "rb").read()).hexdigest() != m["sha256"]:
                    sys.exit("seed sha256 mismatch: a publish was in progress; retrying on restart")
                json.dump({"sha": m.get("sha", ""), "committed_at": int(m.get("committed_at") or 0),
                           "ref": "seed"}, open(sys.argv[3], "w"))
                PY
                  chown root:root /opt/canopy-runner/cloud_runner.py.new /opt/canopy-runner/build-info.json
                  chmod 0755 /opt/canopy-runner/cloud_runner.py.new; chmod 0644 /opt/canopy-runner/build-info.json
                  mv /opt/canopy-runner/cloud_runner.py.new /opt/canopy-runner/cloud_runner.py
                  rm -rf "$SEED"
                fi
                # The stack's parameters for the box's isolation units (spec
                # 2026-10-19-runner-isolation-units §1) — and NO secret: no PAT (a unit
                # pairs by the box's one approved invitation and signs in with its own
                # key), no Claude token (each unit's logins come from canopy-web), no
                # box-wide gog password (each agent's is derived from its unit's own
                # secret). Root-only; `cloud_runner.py --setup-units` makes each unit's
                # env from it on every start.
                install -d -m 755 /etc/canopy-runner
                cat > /etc/canopy-runner/box.env <<ENV
                CANOPY_BASE_URL=${CanopyBaseUrl}
                RUNNER_UNITS=${RunnerUnits}
                RUNNER_PROJECTS=${RunnerProjects}
                RUNNER_AGENTS=${RunnerAgents}
                RUNNER_SESSIONS=${RunnerSessions}
                RUNNER_DIRECTED=${RunnerDirected}
                RUNNER_EXECUTOR=${RunnerExecutor}
                RUNNER_DATA_MODE=${RunnerDataMode}
                RUNNER_EGRESS=${RunnerEgress}
                RUNNER_EGRESS_ALLOW=${RunnerEgressAllow}
                RUNNER_WORKSPACE=${RunnerWorkspace}
                RUNNER_NAME=${RunnerName}
                AGENT_SLUGS=${AgentSlugs}
                ENV
                chmod 600 /etc/canopy-runner/box.env
            - path: /usr/local/bin/canopy-runner-update
              permissions: '0755'
              content: |
                #!/usr/bin/env bash
                # Thin shim. The REAL updater is runner/ec2/update_runner.sh in the
                # canopy-web clone this box already keeps — so the updater itself
                # ships by deploy rather than being frozen here, where cloud-init
                # only ever runs on an instance's FIRST boot (and where a 16 KB
                # UserData cap could not hold it anyway).
                #
                # Read from origin/main, never the working tree: agent turns run in
                # this clone and one may have left it on a branch.
                set -uo pipefail
                REPO="${!CANOPY_WEB_REPO_DIR:-/opt/canopy-web}"
                TMP=$(mktemp)
                trap 'rm -f "$TMP"' EXIT
                git -C "$REPO" show origin/main:runner/ec2/update_runner.sh > "$TMP" 2>/dev/null || true
                if [ ! -s "$TMP" ]; then
                  echo "$(date -u +%FT%TZ) canopy-runner-update: no update_runner.sh in $REPO yet; skipping."
                  exit 0
                fi
                bash "$TMP" "$@"
            - path: /etc/systemd/system/canopy-runner-update.timer
              content: |
                [Unit]
                Description=Ask every 30 min whether this box is behind the deployed runner
                [Timer]
                # Not at boot: the runner clones canopy-web and bootstraps the agent
                # fleet in its first minutes, and an update RESTARTS the service —
                # doing that mid-bootstrap would undo work nothing re-runs until the
                # next start.
                OnBootSec=30min
                OnUnitActiveSec=30min
                AccuracySec=1min
                [Install]
                WantedBy=timers.target
            # needrestart must never restart a canopy unit mid-turn (update_runner.sh
            # also lays this down on boxes already up).
            - path: /etc/needrestart/conf.d/50-canopy-runner.conf
              content: |
                $nrconf{override_rc}->{qr(^canopy-)} = 0;
          runcmd:
            # Swap, so a memory spike slows a turn down instead of the kernel
            # killing one. A t3.medium has 3.8 GB and ships with none; 4 GB here
            # absorbs a test suite or build running beside two agent turns.
            - [ sh, -c, "[ -f /swapfile ] || { fallocate -l 4G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab; }" ]
            # The updater's canopy-web clone: ROOT's on a box of units (no unit may
            # rewrite the code every unit runs); each unit keeps its own clones in
            # its home. --install-units clones it (a public repo: no token).
            - [ install, -d, -o, root, -g, root, /opt/canopy-web ]
            # node 22, and the version is load-bearing rather than "latest LTS".
            # @agentclientprotocol/claude-agent-acp declares `engines: {node: >=22}`
            # from 0.63.0 onward, so on node 20 npm does not fail — it silently
            # RESOLVES DOWN. Measured 2026-09-09: `npm i -g` on this box installed
            # 0.49.0 while the registry's latest was 0.75.1, twenty-six versions
            # back, and the ACP executor then ran without `session/prompt` steering
            # because 0.49.0 predates it. Nothing reported a problem: the install
            # succeeded, the executor worked, and only the absent capability in
            # `initialize` gave it away.
            - [ bash, -c, "curl -fsSL https://deb.nodesource.com/setup_22.x | bash -" ]
            - [ bash, -c, "DEBIAN_FRONTEND=noninteractive apt-get install -y nodejs unzip gnupg python3-websocket" ]
            - [ bash, -c, "npm i -g @anthropic-ai/claude-code" ]
            - [ bash, -c, "curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscliv2.zip && cd /tmp && unzip -q awscliv2.zip && ./aws/install" ]
            # gh (GitHub CLI) and op (1Password CLI) — drill doctors flagged both as
            # missing on the box. Non-fatal (|| true): a transient repo/network hiccup
            # here shouldn't wedge the whole cloud-init run; the runner still comes up
            # and a later `canopy-fetch-env`/manual apt-get can retry.
            - [ bash, -c, "curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /usr/share/keyrings/githubcli-archive-keyring.gpg && chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg && echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main' > /etc/apt/sources.list.d/github-cli.list && apt-get update && apt-get install -y gh || true" ]
            - [ bash, -c, "curl -fsSL https://downloads.1password.com/linux/keys/1password.asc | gpg --dearmor -o /usr/share/keyrings/1password-archive-keyring.gpg && echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/1password-archive-keyring.gpg] https://downloads.1password.com/linux/debian/amd64 stable main' > /etc/apt/sources.list.d/1password.list && mkdir -p /etc/debsig/policies/AC2D62742012EA22 /usr/share/debsig/keyrings/AC2D62742012EA22 && curl -fsSL https://downloads.1password.com/linux/debian/debsig/1password.pol -o /etc/debsig/policies/AC2D62742012EA22/1password.pol && curl -fsSL https://downloads.1password.com/linux/keys/1password.asc | gpg --dearmor -o /usr/share/debsig/keyrings/AC2D62742012EA22/debsig.gpg && apt-get update && apt-get install -y 1password-cli || true" ]
            # Materialize the seed and box.env once (as root), then the systemd units
            # for every isolation unit, from cloud_runner.py itself (spec 2026-10-19
            # §1): users, the IMDS rule, the KMS broker, canopy-pair (ONE
            # pair-by-role for every unit), one canopy-runner@<unit> each, and the
            # auto-updater (root, every unit) — the unit files live in the runner,
            # not here, so the 16 KB cap holds and a live box can be moved in place.
            - [ bash, -c, "/usr/local/bin/canopy-fetch-env" ]
            - [ python3, /opt/canopy-runner/cloud_runner.py, --install-units ]

Outputs:
  InstanceId:
    Value: !Ref Instance
  PublicIp:
    Value: !GetAtt Instance.PublicIp
  KeyPairId:
    Value: !GetAtt KeyPair.KeyPairId
    Description: Read the private key from SSM at /ec2/keypair/<this id> to SSH.
