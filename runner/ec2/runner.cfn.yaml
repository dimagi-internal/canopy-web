AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Canopy cloud runner (Wave 4 SP2b) — an ephemeral EC2 instance that pairs a
  kind=cloud runner with canopy-web, claims harness Turns in its capabilities, and
  runs `claude -p` on each. Secrets (the claude OAuth token + the canopy PAT) are
  read from Secrets Manager by the instance role at boot — never baked into the
  template. cloud_runner.py is ALSO delivered via Secrets Manager (up.sh publishes it
  there); single source of truth is runner/ec2/cloud_runner.py.

Parameters:
  SshCidr:
    Type: String
    Description: CIDR allowed to SSH (the launcher's IP/32).
  InstanceType:
    Type: String
    Default: t3.medium
  Ami:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
  CanopyBaseUrl:
    Type: String
    Default: https://labs.connect.dimagi.com/canopy
  RunnerProjects:
    Type: String
    Default: canopy-web
    Description: Comma-separated repo names this runner may drive.
  RunnerAgents:
    Type: String
    Default: ''
    Description: Comma-separated agent slugs this runner may drive.
  RunnerSessions:
    Type: String
    AllowedValues: ['0', '1']
    Default: '1'
    Description: >
      Whether this runner declares capabilities.sessions and may therefore claim
      chat/session-targeted turns — including the ace-web runs delegated to
      canopy's harness, which are session-targeted by construction and are the
      reason this box exists (spec 2026-07-27 source-aware runner routing).

      Default ON as of 2026-07-28, once the durable-record path was verified end
      to end on this box: a session turn now ships its transcript rows via
      /runners/{id}/session-stream and lands ordinal-keyed Message rows, and
      resumes its CLI session across turns. Two server-side defects had to be
      fixed first — the WS claim frame dropped origin_ref (so the runner could
      not tell a session turn was one), and the in-repo packages were installed
      by a method this AMI cannot run, so canopy_transcript was never importable.

      Still NOT implemented here: /runners/{id}/streams + /backfills, so a
      viewer attached mid-turn sees the reduced TurnEvent stream rather than a
      live transcript tail, and a server-requested backfill is ignored. History
      is not lost by either — the transcript ships at turn end regardless.
  AgentSlugs:
    Type: String
    Default: 'ace,ada,echo,eva,hal'
    Description: >
      Comma-separated agent slugs to BOOTSTRAP on this box (clone + `canopy
      provision` + gmail token) — runner/ec2/bootstrap_agents.sh's
      AGENT_SLUGS. Distinct from RunnerAgents: this is what gets PROVISIONED
      here; RunnerAgents is what this runner may CLAIM turns for. Usually the
      same set, but a box can bootstrap the whole fleet while only claiming a
      subset (or vice versa, if bootstrap fails for one agent).
  RunnerWorkspace:
    Type: String
    Default: dimagi
  RunnerName:
    Type: String
    Default: cloud-ec2-1
  ClaudeTokenSecret:
    Type: String
    Default: canopy/cloud-runner/claude-oauth-token
    Description: >
      Secrets Manager id holding a dedicated claude setup-token (the long-lived,
      non-rotating CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`). Dedicated to
      this runner so it never rotation-conflicts with ace-web's OAuth session.
  CanopyTokenSecret:
    Type: String
    Default: canopy/cloud-runner/canopy-pat
    Description: Secrets Manager id holding the canopy-web PAT.
  GogKeyringSecret:
    Type: String
    Default: canopy/cloud-runner/gog-keyring-password
    Description: >
      Secrets Manager id holding the password for gog's `file` keyring backend
      (exported as GOG_KEYRING_PASSWORD). Optional — if the secret is absent the
      runner still boots, but every `gog auth tokens import` fails and the fleet
      has no Gmail/Drive auth. Stage it with `./secrets.sh gog <file|->`.
  RunnerCodeSecret:
    Type: String
    Default: canopy/cloud-runner/runner-code
    Description: >
      Secrets Manager id holding cloud_runner.py as a single-line gzip+base64
      blob, published by up.sh on every deploy. The code does NOT live in
      UserData: EC2 caps UserData at 16 KB and the gz+b64 runner alone is ~12 KB,
      which (plus the rest of this cloud-config) blew the cap and made the stack
      undeployable — CREATE_FAILED "User data is limited to 16384 bytes". Keeping
      it in Secrets Manager also means the runner code is re-fetched by
      canopy-fetch-env on every service start, so `./up.sh && systemctl restart
      canopy-runner` ships new runner bytes without recycling the instance.

Resources:
  KeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Sub '${AWS::StackName}-key'

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'canopy cloud runner ${AWS::StackName} (SSH from launcher only)'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshCidr
      Tags:
        - { Key: Name, Value: !Ref AWS::StackName }
        - { Key: purpose, Value: canopy-cloud-runner }

  RunnerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: read-runner-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:canopy/cloud-runner/*'

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [ !Ref RunnerRole ]

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref Ami
      KeyName: !Ref KeyPair
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [ !Ref SecurityGroup ]
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: { VolumeSize: 20, VolumeType: gp3 }
      Tags:
        - { Key: Name, Value: !Ref AWS::StackName }
        - { Key: purpose, Value: canopy-cloud-runner }
      # DEPLOY GAP (still real for THIS block): CFN applies a UserData change as a
      # stop/start of the SAME instance, which does NOT re-run cloud-init
      # (cloud-init only runs write_files/runcmd on an instance's first boot). So
      # editing anything baked in below and redeploying does NOT ship it to a
      # running box — recycle the stack (`./down.sh && ./up.sh`) to pick it up.
      # cloud_runner.py is EXEMPT: it comes from Secrets Manager and is re-fetched
      # by canopy-fetch-env on every start, so a runner-code change ships with
      # `./up.sh && systemctl restart canopy-runner`. Keep this block small — the
      # whole rendered UserData must stay under EC2's hard 16 KB cap.
      UserData:
        Fn::Base64: !Sub |
          #cloud-config
          write_files:
            - path: /usr/local/bin/canopy-fetch-env
              permissions: '0755'
              content: |
                #!/usr/bin/env bash
                # Re-materialize the runner env + claude credentials + the runner
                # CODE from Secrets Manager on every start, so a rotated secret or a
                # freshly-published cloud_runner.py is picked up on `systemctl
                # restart` with no redeploy.
                set -euo pipefail
                R="${AWS::Region}"
                secret() { aws --region "$R" secretsmanager get-secret-value --secret-id "$1" --query SecretString --output text; }
                umask 077
                install -d -o ubuntu -g ubuntu /opt/canopy-runner
                # cloud_runner.py lives in Secrets Manager, not UserData (16 KB cap).
                # Decode to a temp file and mv into place so a failed fetch can never
                # leave a truncated script that systemd would then try to exec.
                secret ${RunnerCodeSecret} | base64 -d | gunzip > /opt/canopy-runner/cloud_runner.py.new
                chown ubuntu:ubuntu /opt/canopy-runner/cloud_runner.py.new
                chmod 0755 /opt/canopy-runner/cloud_runner.py.new
                mv /opt/canopy-runner/cloud_runner.py.new /opt/canopy-runner/cloud_runner.py
                # gog's `file` keyring backend (the only option on a headless box —
                # there is no OS keychain) encrypts with a password it PROMPTS for.
                # With no TTY the prompt is impossible, so every `gog auth tokens
                # import` died with "no TTY available for keyring file backend
                # password prompt; set GOG_KEYRING_PASSWORD" and the whole fleet had
                # zero Gmail/Drive auth. It has to live in the runner's own env, not
                # just bootstrap's: gog needs the password to READ tokens too, so
                # every agent turn (which inherits this env) needs it as well.
                # Optional — an absent secret must not wedge the service, so this
                # tolerates failure and simply leaves gog unusable, as before.
                GOG_PW=$(secret ${GogKeyringSecret} 2>/dev/null || true)
                cat > /opt/canopy-runner/runner.env <<ENV
                GOG_KEYRING_PASSWORD=$GOG_PW
                CANOPY_BASE_URL=${CanopyBaseUrl}
                CANOPY_TOKEN=$(secret ${CanopyTokenSecret})
                CLAUDE_CODE_OAUTH_TOKEN=$(secret ${ClaudeTokenSecret})
                RUNNER_PROJECTS=${RunnerProjects}
                RUNNER_AGENTS=${RunnerAgents}
                RUNNER_SESSIONS=${RunnerSessions}
                RUNNER_WORKSPACE=${RunnerWorkspace}
                RUNNER_NAME=${RunnerName}
                AGENT_SLUGS=${AgentSlugs}
                ENV
                chown ubuntu:ubuntu /opt/canopy-runner/runner.env
                chmod 600 /opt/canopy-runner/runner.env
            - path: /etc/systemd/system/canopy-runner.service
              content: |
                [Unit]
                Description=Canopy cloud runner
                After=network-online.target
                Wants=network-online.target
                [Service]
                Type=simple
                # '+' runs fetch-env as root (writes /opt + /home/ubuntu/.claude);
                # '-' makes the env file optional so the first start (before
                # cloud-init's one-shot fetch) can't wedge the unit.
                ExecStartPre=+/usr/local/bin/canopy-fetch-env
                EnvironmentFile=-/opt/canopy-runner/runner.env
                # ~/.local/bin so `uv tool install`-shipped binaries (the canopy
                # CLI, and gog when it falls back off /usr/local/bin — see
                # bootstrap_agents.sh install_gog()) are on PATH for
                # cloud_runner.py's own subprocess calls (bootstrap_agents.sh,
                # claude turns, git). No ExecStartPre here for the canopy-web
                # clone / bootstrap_agents.sh run — see cloud_runner.py's
                # bootstrap_agent_fleet() docstring for why that runs from
                # inside main(), after credentials are staged, not here.
                Environment=PATH=/home/ubuntu/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
                ExecStart=/usr/bin/python3 /opt/canopy-runner/cloud_runner.py
                Restart=on-failure
                RestartSec=10
                User=ubuntu
                [Install]
                WantedBy=multi-user.target
          runcmd:
            # /opt is root:root 0755 by default — pre-create the two directories
            # cloud_runner.py's bootstrap_agent_fleet() writes into (as `ubuntu`,
            # the service user) so it never needs root just to mkdir. Harmless to
            # run before credentials exist; both start empty.
            - [ install, -d, -o, ubuntu, -g, ubuntu, /opt/canopy-web, /opt/agents ]
            - [ bash, -c, "curl -fsSL https://deb.nodesource.com/setup_20.x | bash -" ]
            - [ bash, -c, "DEBIAN_FRONTEND=noninteractive apt-get install -y nodejs unzip gnupg python3-websocket" ]
            - [ bash, -c, "npm i -g @anthropic-ai/claude-code" ]
            - [ bash, -c, "curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscliv2.zip && cd /tmp && unzip -q awscliv2.zip && ./aws/install" ]
            # gh (GitHub CLI) and op (1Password CLI) — drill doctors flagged both as
            # missing on the box. Non-fatal (|| true): a transient repo/network hiccup
            # here shouldn't wedge the whole cloud-init run; the runner still comes up
            # and a later `canopy-fetch-env`/manual apt-get can retry.
            - [ bash, -c, "curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /usr/share/keyrings/githubcli-archive-keyring.gpg && chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg && echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main' > /etc/apt/sources.list.d/github-cli.list && apt-get update && apt-get install -y gh || true" ]
            - [ bash, -c, "curl -fsSL https://downloads.1password.com/linux/keys/1password.asc | gpg --dearmor -o /usr/share/keyrings/1password-archive-keyring.gpg && echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/1password-archive-keyring.gpg] https://downloads.1password.com/linux/debian/amd64 stable main' > /etc/apt/sources.list.d/1password.list && mkdir -p /etc/debsig/policies/AC2D62742012EA22 /usr/share/debsig/keyrings/AC2D62742012EA22 && curl -fsSL https://downloads.1password.com/linux/debian/debsig/1password.pol -o /etc/debsig/policies/AC2D62742012EA22/1password.pol && curl -fsSL https://downloads.1password.com/linux/keys/1password.asc | gpg --dearmor -o /usr/share/debsig/keyrings/AC2D62742012EA22/debsig.gpg && apt-get update && apt-get install -y 1password-cli || true" ]
            # Materialize the env + creds once (as root) BEFORE first start, so the
            # unit doesn't fail on a missing EnvironmentFile on boot.
            - [ bash, -c, "/usr/local/bin/canopy-fetch-env" ]
            - [ systemctl, daemon-reload ]
            - [ systemctl, enable, --now, canopy-runner.service ]

Outputs:
  InstanceId:
    Value: !Ref Instance
  PublicIp:
    Value: !GetAtt Instance.PublicIp
  KeyPairId:
    Value: !GetAtt KeyPair.KeyPairId
    Description: Read the private key from SSM at /ec2/keypair/<this id> to SSH.
