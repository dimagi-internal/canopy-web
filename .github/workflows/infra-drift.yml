# .github/workflows/infra-drift.yml
name: Infra drift

# Nothing detected drift until someone ran detect-stack-drift by hand on
# 2026-09-09 and found labs-jj-audit-analytics had a task-definition environment
# variable changed out-of-band — a change the next `cloudformation deploy` would
# have silently reverted. A stack that has drifted is a stack whose template no
# longer describes what is running, which makes every review of that template a
# review of the wrong thing.
#
# Read-only: detect-stack-drift inspects, it does not reconcile.
#
# Runs on a SCHEDULE as of 2026-09-09. It shipped dispatch-only because the
# deploy role had implicitDeny on all three drift actions, which would have
# failed every night. Those grants are now in place:
#
#     cloudformation:DetectStackDrift            (stack-scoped)
#     cloudformation:DescribeStackResourceDrifts (stack-scoped)
#     cloudformation:DescribeStackDriftDetectionStatus  on "*" -- it takes a
#       DETECTION ID, not a stack ARN, so a stack-scoped grant matches nothing
#       and silently denies. That cost one debugging round; do not "tidy" it
#       back to a stack scope.
#
# They are still HAND-MADE on the shared role and tracked nowhere. Moving them
# into the canopy-web bootstrap stack is the outstanding work -- see
# docs/superpowers/specs/2026-09-09-labs-iac-status.md.

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC daily, after the nightly contract run
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  drift:
    name: Detect CloudFormation drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Detect drift
        run: |
          set -o pipefail
          # canopy-web only. The deploy role's CloudFormation grants are scoped
          # to stack/canopy-web/* and stack/ace-web/*, with nothing at all for
          # canopy-cloud-runner — including it would guarantee a failure even
          # after the drift grant lands. ace-web and the connect-labs platform
          # stacks are detected from their own repos; each repo is
          # self-contained, which is the point.
          STACKS="canopy-web"
          FAILED=0

          for STACK in $STACKS; do
            echo "::group::$STACK"
            if ! ID=$(aws cloudformation detect-stack-drift --stack-name "$STACK" \
                        --query StackDriftDetectionId --output text 2>&1); then
              echo "::error::Cannot detect drift on $STACK: $ID"
              echo "If this is an AccessDenied, the deploy role still lacks the"
              echo "cloudformation:DetectStackDrift grant — see the header of this file."
              echo "::endgroup::"
              exit 1
            fi

            # Detection is asynchronous; poll until it stops being IN_PROGRESS.
            for _ in $(seq 1 60); do
              STATUS=$(aws cloudformation describe-stack-drift-detection-status \
                         --stack-drift-detection-id "$ID" \
                         --query DetectionStatus --output text)
              [ "$STATUS" = "DETECTION_IN_PROGRESS" ] || break
              sleep 5
            done

            DRIFT=$(aws cloudformation describe-stack-drift-detection-status \
                      --stack-drift-detection-id "$ID" \
                      --query StackDriftStatus --output text)
            echo "$STACK: detection=$STATUS drift=$DRIFT"

            # A detection that never completed must never read as "no drift".
            # DETECTION_FAILED means CloudFormation itself gave up (e.g. it
            # couldn't read a resource); a still-IN_PROGRESS status after the
            # poll loop above gave up means we simply stopped watching. Either
            # way DRIFT is not "DRIFTED" here, so without this check the job
            # would exit 0 having verified nothing — a detection that never ran
            # looking exactly as healthy as a clean one.
            if [ "$STATUS" = "DETECTION_FAILED" ]; then
              echo "::error::$STACK drift detection FAILED — CloudFormation could not complete it. This proves nothing about drift; it is not the same as clean."
              FAILED=1
            elif [ "$STATUS" = "DETECTION_IN_PROGRESS" ]; then
              echo "::error::$STACK drift detection timed out still IN_PROGRESS after the poll loop. This proves nothing about drift; it is not the same as clean."
              FAILED=1
            elif [ "$DRIFT" = "DRIFTED" ]; then
              aws cloudformation describe-stack-resource-drifts \
                --stack-name "$STACK" \
                --stack-resource-drift-status-filters MODIFIED DELETED \
                --query 'StackResourceDrifts[].{Resource:LogicalResourceId,Type:ResourceType,Status:StackResourceDriftStatus,Properties:PropertyDifferences[].PropertyPath}' \
                --output json
              FAILED=1
            fi
            echo "::endgroup::"

            if [ "$DRIFT" = "DRIFTED" ]; then
              echo "::error::$STACK has drifted — the template no longer describes what is running. The next deploy will silently revert it."
            fi
          done

          exit $FAILED
