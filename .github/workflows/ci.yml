name: CI

# Runs backend tests + frontend build ONCE per change: in the merge queue (and
# on push to main). Deploys are a separate, manual workflow:
# .github/workflows/deploy-labs.yml (GitHub → AWS labs / ECS Fargate).
#
# Why not on the PR too (Jonathan, 2026-10-19). The ruleset requires
# `Backend tests` and `Frontend build` green on the PR before it may ENTER the
# queue, and the queue then runs them again on the PR merged onto the queue
# head. That second run is the one that matters — it tests what will actually
# land on main — so a full PR run only doubled every merge's wait (~6 min PR +
# ~6 min queue) to re-prove what the queue proves anyway. On a PR the two
# required names are now GATES that pass on the PR-only jobs: `PR guards`
# (version bumps measured against the PR base, which the queue cannot see),
# and `PR fast checks` / `PR frontend checks` (lint, ratchets, codegen sync, a
# type check and the tests near the PR's changes — about a minute each). The
# real suites run in `merge_group`. A failure there ejects the PR AND rebuilds
# every queue entry behind it, which is why anything a PR alone can fail is
# caught here first. `Secret scan` still runs on the PR, where it is useful
# before a secret spreads.

on:
  push:
    branches: [main]
  pull_request:
  # Required for the merge queue: GitHub runs the required checks against the
  # QUEUED merge result (this PR rebased onto the queue head), not the PR branch.
  # Without this trigger those checks never report, every PR sits in the queue
  # until it times out, and NOTHING can merge. Must land before the queue is
  # switched on.
  merge_group:

# Nothing here writes to the repo, comments, or assumes a cloud role — checkout
# and the actions/setup-* caches need only read (the cache uses the runner's own
# token, not GITHUB_TOKEN).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Backend ────────────────────────────────────────────────────────────
  #
  # Three jobs, ONE required check. The Django suite (`Backend pytest`) and
  # the standalone package suites (`Runner packages`) run in PARALLEL, and
  # `Backend tests` — the name the `main protection` ruleset requires — is a
  # gate that needs both. Until 2026-10 the package suites ran serially
  # after pytest in a single job, adding ~75-90s to the critical path of
  # every PR and every merge-queue entry.
  #
  # Why a gate instead of adding `Runner packages` to the ruleset: a newly
  # required check is "expected" on every OPEN PR, and a PR whose branch
  # predates this file never produces it, so each one would block until
  # someone rebased it. Keeping the required name on a gate changes nothing
  # for anyone, and any future backend job joins `needs:` below rather than
  # the ruleset.
  #
  # `Backend pytest` is a matrix of 3 shards (conftest.py's PYTEST_SHARD
  # hook: whole files, balanced by test count, union = the whole suite), run
  # with `--nomigrations`. Of the ~5 min one runner used to take, ~2.5 was each
  # xdist worker replaying 400+ migrations to build its test DB; building the
  # tables from the models takes seconds. Migrations are still applied in full,
  # once, by `Backend pytest (PostgreSQL)` (on the production engine, where the
  # needs_migrations tests also run), and `makemigrations --check` runs on
  # shard 1 with the other fast static gates — once is enough.
  test-backend:
    name: Backend pytest (${{ matrix.shard }}/3)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --extra dev

      # Fast, zero-DB gates before the (longer) test run — they reuse the uv env
      # already synced above, so they add ~seconds, not a new job spin-up.

      # Catch real bugs: unused imports (F401) and undefined names (F821/F811).
      # Scoped to pyflakes (`--select F`), not the full ruff ruleset — the repo
      # isn't style-clean yet, and this gate is about correctness, not formatting.
      # F403/F405 are ignored: the settings modules use `from base import *` by design.
      # PLC0415 (an import inside a function) is on for apps/ and config/: a new lazy
      # import must say why (`# noqa: PLC0415 — <reason>`); the files that had them
      # are frozen in ruff-lazy-imports.toml (tests/test_lazy_import_baseline.py).
      - name: Lint (ruff — pyflakes + lazy imports)
        if: matrix.shard == 1
        run: uv run ruff check . --select F,PLC0415 --ignore F403,F405

      # A model change without its migration is a class of bug this fast-moving repo
      # hits often; catch it before it reaches a deploy. Test settings = SQLite, no
      # DB server needed.
      - name: Check migrations are in sync
        if: matrix.shard == 1
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - name: Django system checks
        if: matrix.shard == 1
        run: uv run python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      # Frontend types (frontend/src/api/generated.ts) are GENERATED from the
      # backend's OpenAPI schema, which Django Ninja builds partly out of route
      # docstrings — so an edit to a docstring, a schema, or a route makes the
      # committed file stale. A stale file is a SILENT failure: it is still
      # self-consistent TypeScript, so `Frontend build` passes and the next
      # person to regenerate finds an unrelated diff in their PR.
      #
      # This lived in its own workflow (regen-openapi.yml) that could not be
      # made a required check, for two independent reasons — so it failed and
      # PRs merged anyway, twice (#575, then #756 → #757):
      #   1. No `merge_group` trigger, so it never reports against the queued
      #      merge result. Requiring it would have hung the queue forever — see
      #      the `on:` block at the top of this file.
      #   2. A `paths:` filter, so it does not run at all on PRs that miss the
      #      filter, and a required check that never reports blocks the PR.
      # It lives HERE instead: this job already runs on `merge_group` and gates the
      # required `Backend tests` check, so there is no ruleset change to make and nothing new
      # that can deadlock.
      #
      # Unconditional, not path-scoped, and that is an upgrade rather than a
      # cost. The old filter (`apps/**/api.py`, `apps/**/schemas.py`,
      # `apps/api/**`) was a GUESS about what can move the schema and was
      # provably incomplete — a Literal fed by an enum in `models.py`, a router
      # registered elsewhere, or `generated.ts` mangled by a bad merge with no
      # backend change at all, all slipped past it. Costs ~10s on a 2-minute
      # job: the uv env above is reused, and only the codegen package is
      # fetched.
      - uses: actions/setup-node@v7
        if: matrix.shard == 1
        with:
          node-version: "20"

      - name: Check generated frontend types are in sync
        if: matrix.shard == 1
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          uv run python -c "
          import django, json
          django.setup()
          from apps.api.api import api
          with open('frontend/openapi.json', 'w') as f:
              json.dump(api.get_openapi_schema(), f, indent=2)
          "
          # Pinned to the same major the frontend declares, so CI and a local
          # `npm run gen:api:local` cannot disagree about formatting and report
          # a phantom diff.
          npx --yes 'openapi-typescript@^7.13.0' frontend/openapi.json \
            --output frontend/src/api/generated.ts --immutable
          if ! git diff --quiet frontend/src/api/generated.ts; then
            echo "::error file=frontend/src/api/generated.ts::generated.ts is out of date with the OpenAPI schema."
            echo "You changed a route, a schema, or a route DOCSTRING without regenerating the types."
            echo "Fix it locally and commit the result:"
            echo "    cd frontend && npm run gen:api        # backend running on :8000"
            echo "    # or dump the schema first, then: npm run gen:api:local"
            echo "--- diff ---"
            git --no-pager diff frontend/src/api/generated.ts
            exit 1
          fi
          echo "generated.ts is up to date."

      - name: Run pytest
        # -n auto: one worker per core (pytest-xdist). Each worker builds its own
        # in-memory test DB, so the suite is isolated per worker; serially it was
        # ~160s here, nearly all of it single-threaded.
        env:
          PYTEST_SHARD: ${{ matrix.shard }}/3
        run: uv run pytest -n auto --nomigrations -m "not needs_migrations"

  # The standalone in-repo packages. None of them touches Django or a
  # database: each runs from its own dir against its own declared deps.
  #
  # One job, not a matrix of eight: together these take ~75-90s, which
  # already finishes well inside `Backend pytest` (~3-5 min), so splitting
  # them further cannot shorten the run — it would only pay checkout + uv
  # setup eight times over and hold eight runners per PR.
  test-runner-packages:
    name: Runner packages
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # NOT for the packages, which each resolve their own env. runner/ec2 has
      # no pyproject.toml, so `uv run` there walks UP and runs in the ROOT
      # project's env — exactly as it did when these steps lived in the
      # backend job after its `uv sync`. Synced here so the cloud_runner suite
      # keeps seeing the same env it always has (see the note on that step).
      - name: Sync root dependencies (cloud_runner suite runs in the root env)
        run: uv sync --extra dev

      # The root suite sets --ignore=packages, so each standalone in-repo package
      # needs its own invocation from its own dir — otherwise its tests never run
      # on a PR. Running from the package dir (rather than --project ../..) also
      # resolves each package's OWN declared deps, so the dependency wiring is
      # exercised rather than masked by the root env.
      #
      # canopy_cron holds the cron/DST slot math that the server's preview and the
      # runner's firing SHARE — one implementation precisely so the UI can't say
      # "Fridays" while the runner fires Thursdays. Its DST cases are the reason
      # the extraction exists; they must actually execute somewhere.
      - name: Run canopy_cron tests
        working-directory: packages/canopy_cron
        run: uv run --with pytest pytest -q

      # canopy_kb's own suite is not here: it runs by hand, while working on the
      # KB (.github/workflows/canopy-kb.yml). canopy-web's serving of it (tests/
      # test_kb_*.py, test_project_mcp.py) still runs in the backend job.

      # The runner decides WHICH slot is due and fires it, so its suite is the only
      # thing standing between a scheduling bug and a fleet that silently never
      # fires (or fires a slot predating its schedule). Also covers the
      # session-reuse regressions.
      # -n logical: 1,392 tests, 85s serial → 33s on 4 workers (measured).
      - name: Run canopy_runner tests
        working-directory: runner/canopy_runner
        run: uv run --with pytest --with pytest-xdist --with psutil pytest -n logical

      # cloud_runner.py has a 48-test suite that had never run in CI — the file
      # is loaded by path (it lives under a hyphenated dir and can't be imported
      # as a package), which is presumably why it was missed. It executes turns
      # for the whole cloud fleet and cannot be tested against live EC2, so this
      # suite is the only gate it has.
      #
      # NOTE: this does NOT run in a bare env. runner/ec2 has no
      # pyproject.toml, so uv discovers the ROOT project and Django et al. are
      # importable here. That is fine: the stdlib-only invariant is checked
      # against the module itself by tests/test_stdlib_only.py (#1351), not
      # inferred from the env — a `--no-project` run would still have to carry
      # canopy_transcript and yaml for the tests, which proves nothing.
      #
      # -n auto: at ~100s on one core this was the longest step in the job.
      # Each test builds its own tmp state, so it splits cleanly (6/6 clean
      # local runs under xdist). canopy_runner's suite stays serial: under
      # xdist its pause-sentinel test failed 1 run in 10.
      - name: Run cloud_runner tests
        working-directory: runner/ec2
        run: uv run --with pytest --with pytest-timeout --with pytest-xdist pytest -q -n auto

      # canopy_transcript is the Claude Code transcript core BOTH runners execute
      # against — ordinals, block extraction, payload caps, NUL scrubbing. It was
      # extracted precisely because the two runners had drifted apart while each
      # believed it was doing the same thing, so its suite is what keeps them
      # honest. The composite-ordinal cases in particular guard a collision that
      # would silently drop rows rather than fail.
      - name: Run canopy_transcript tests
        working-directory: packages/canopy_transcript
        run: uv run --with pytest pytest -q

      # canopy_acp is the ACP client the CLOUD runner executes turns through.
      # Its reducer is the piece that cannot be eyeballed: ACP's tool_call_update
      # is a sparse PATCH, so a merge bug renders half-empty tool calls rather
      # than failing, and the suite replays a recorded live sequence to catch it.
      # The live-adapter tests skip unless ACP_ADAPTER_PATH is set (they need
      # Node, Claude auth and tokens), so CI runs the protocol logic only.
      - name: Run canopy_acp tests
        working-directory: runner/canopy_acp
        run: uv run --with pytest pytest -q

      # canopy_agent_runs is the Django-free run-lifecycle core that apps/agent_runs
      # imports directly (schemas, stores, the Drive client) — not dead code — yet its
      # suite had never run in CI. `--extra drive` is required, not optional polish:
      # the Drive google_client tests import googleapiclient, which lives in the
      # package's optional `drive` group. Without it 10 tests fail on ImportError.
      - name: Run canopy_agent_runs tests
        working-directory: packages/canopy_agent_runs
        run: uv run --extra drive --with pytest pytest

      # canopy_runtime defines + validates capability.yaml (CapabilityManifest) and
      # `publish-capabilities`, Django-free so an agent deploy can publish; its
      # guardrails (extra="forbid", a --dir that cannot miss a manifest) must execute.
      - name: Run canopy_runtime tests
        working-directory: packages/canopy_runtime
        run: uv run --with pytest pytest -q

      # dimagi-canopy (sdk/python, import `canopy_sdk`) is the SDK every host
      # embeds to implement its half of host grant contract v1 — the security
      # code (ID-JAG and private_key_jwt verification, DPoP, single-use jtis,
      # SSRF-safe fetches) a host would otherwise hand-write. Its suite carries
      # every refusal path from connect-labs' implementation, so it must run on
      # every PR; from its own dir, against its OWN declared deps (the `test`
      # extra), so a dependency it forgot to declare fails here rather than in
      # a host. The two halves are ALSO run against each other by the root
      # suite (tests/test_sdk_round_trip.py).
      - name: Run dimagi-canopy SDK tests
        working-directory: sdk/python
        run: uv run --extra test pytest -q

  # What SQLite cannot test: pgvector (the dormant KB vectors, kept working for a
  # corpus that turns them on — the HNSW index, the filtered nearest-neighbour
  # query, vectors joining search through the MCP tool), and the KB version log's
  # row locks (the index job claims with SELECT … FOR UPDATE SKIP LOCKED). The
  # suite skips itself on SQLite, so `Backend pytest` alone would wave a broken
  # vector path through. Runs only the PostgreSQL-specific files (the whole suite
  # on Postgres is minutes longer and adds nothing SQLite does not already cover).
  test-backend-postgres:
    name: Backend pytest (PostgreSQL)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: canopy_web
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --extra dev

      # A throwaway database: durability buys nothing, and building the test DB
      # (every migration, ~530 of them) is nearly all of this job's time.
      - name: Make the CI database skip durability
        env:
          PGPASSWORD: postgres
        run: |
          for setting in "fsync = off" "synchronous_commit = off" "full_page_writes = off"; do
            psql -h localhost -U postgres -c "ALTER SYSTEM SET $setting"
          done
          psql -h localhost -U postgres -c "SELECT pg_reload_conf()"

      # The migrated test DB is a pure function of the migrations, the settings and
      # the pinned dependencies, so it is built once per distinct set of them: a
      # push to main that changes any of them replays the whole graph on the
      # production engine (the proof every migration applies —
      # tests/test_migrations_apply.py) and saves a dump; a queue run on the same
      # inputs restores it in seconds (a merge_group ref reads main's caches). A
      # PR that adds a migration misses the key and replays for real.
      - name: Restore the migrated test DB
        id: testdb
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/testdb.dump
          key: pg-testdb-v1-${{ hashFiles('apps/**/migrations/*.py', 'sdk/python/src/**/migrations/*.py', 'config/settings/*.py', 'uv.lock', 'pyproject.toml') }}

      - name: Build the test DB (every migration) — or load the cached build
        env:
          PGPASSWORD: postgres
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_canopy_web
          DJANGO_SETTINGS_MODULE: config.settings.pgtest
          HIT: ${{ steps.testdb.outputs.cache-hit }}
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE test_canopy_web"
          if [ "$HIT" = "true" ]; then
            pg_restore -h localhost -U postgres -d test_canopy_web --no-owner --exit-on-error /tmp/testdb.dump
            echo "::notice::Restored the migrated test DB (migrations unchanged since main built it)."
          else
            uv run python manage.py migrate --noinput
            pg_dump -h localhost -U postgres -Fc -f /tmp/testdb.dump test_canopy_web
          fi

      - name: Save the migrated test DB
        if: github.event_name == 'push' && steps.testdb.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/testdb.dump
          key: ${{ steps.testdb.outputs.cache-primary-key }}

      # Both runs reuse that DB (pytest-django's test_<NAME>): first the tests that
      # walk migrations (marked needs_migrations; each is deleted once its migration
      # deploys), then the PostgreSQL-only suites. One process each, not xdist:
      # every worker would build its own DB again (measured slower).
      - name: Run the migration tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/canopy_web
        run: uv run pytest --ds=config.settings.pgtest --reuse-db -m needs_migrations -q

      - name: Run the PostgreSQL suites
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/canopy_web
        run: >-
          uv run pytest --ds=config.settings.pgtest --reuse-db tests/test_kb_vectors_pg.py tests/test_kb_vectors.py
          tests/test_kb_versions.py tests/test_project_mcp.py tests/test_canopy_vault_phase1b.py -q --durations=10

  # The checks that only make sense on a PR, because they compare against the
  # PR's BASE — which a merge-group run does not have. On a PR these are the
  # whole of what the two required gates wait for.
  # The cheap, deterministic half of the backend checks, run on the PR so an
  # agent learns about them BEFORE it enters the queue. Tests still run once
  # (in the queue, see the top of this file); these are the checks that fail
  # identically on the PR and in the queue, so moving them earlier costs ~1
  # min of PR time and saves a queue ejection.
  #
  # Why (measured 2026-10-27): after the suites left the PR (2026-10-19), the
  # merge-queue failure rate went from ~3% to 25-50% a day, re-queued PRs from
  # 3% to 25%, and p90 queue->merge from 8 to 75 min. An ejection is not one
  # PR's ~5 min: with ALLGREEN and max_entries_to_build=5, every entry built
  # on top of the failed one is thrown away and rebuilt. Of a sample of the
  # failed queue runs, ~40% failed only these static gates (lazy-import and
  # layered-import ratchets, generated.ts out of date, test-module imports);
  # most of the rest failed a test in a file the PR itself changed, which is
  # why those test files run here too.
  #
  # What this cannot catch: two PRs that each pass alone and conflict once
  # combined (two edits to a ratchet baseline). Only the queue sees that.
  pr-fast-checks:
    name: PR fast checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --extra dev

      # The same commands `Backend pytest (1/3)` runs; keep them in step.
      - name: Lint (ruff — pyflakes + lazy imports)
        run: uv run ruff check . --select F,PLC0415 --ignore F403,F405

      - name: Check migrations are in sync
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - name: Django system checks
        run: uv run python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Check generated frontend types are in sync
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          uv run python -c "
          import django, json
          django.setup()
          from apps.api.api import api
          with open('frontend/openapi.json', 'w') as f:
              json.dump(api.get_openapi_schema(), f, indent=2)
          "
          npx --yes 'openapi-typescript@^7.13.0' frontend/openapi.json \
            --output frontend/src/api/generated.ts --immutable
          if ! git diff --quiet frontend/src/api/generated.ts; then
            echo "::error file=frontend/src/api/generated.ts::generated.ts is out of date with the OpenAPI schema."
            echo "Regenerate it locally and commit the result: cd frontend && npm run gen:api"
            git --no-pager diff frontend/src/api/generated.ts
            exit 1
          fi

      # The source-walking ratchets (no DB, seconds), plus every Django-suite
      # test file this PR touched. A file deleted by the PR is skipped.
      - name: Guard tests and the test files this PR changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          CHANGED=$(git diff --name-only --diff-filter=d "$BASE_SHA"...HEAD \
            | grep -E '^(tests|apps/[^/]+/tests)/(.*/)?test_[^/]*\.py$' || true)
          uv run pytest -n auto --nomigrations -m "not needs_migrations" -q \
            tests/test_lazy_import_baseline.py \
            tests/test_layered_app_imports.py \
            tests/test_no_test_module_imports.py \
            tests/test_architecture_boundary.py \
            $CHANGED

  pr-guards:
    name: PR guards
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The npm guard diffs against the PR base; the SDK guard against the
          # merge commit's first parent.
          fetch-depth: 0

      # A released SDK whose source moved without its version moving is the
      # same silent failure as the npm guard in `Frontend build`: the
      # `dimagi-canopy-v<version>` tag a host pins would name code that is no
      # longer what that version means. Bumping the version IS the release
      # (release-dimagi-canopy.yml). Diffed against the merge commit's first
      # parent — the base this PR was merged onto — hence `fetch-depth: 2`.
      - name: dimagi-canopy needs a version bump when its source changes
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet HEAD^1 HEAD -- sdk/python/src; then
            echo "dimagi-canopy: src unchanged, no bump needed."
            exit 0
          fi
          version() {
            python3 -c "import sys, tomllib; print(tomllib.loads(sys.stdin.read())['project']['version'])"
          }
          after=$(version < sdk/python/pyproject.toml)
          if ! before=$(git show HEAD^1:sdk/python/pyproject.toml 2>/dev/null | version); then
            echo "dimagi-canopy: new package at $after."
            exit 0
          fi
          if [ "$before" = "$after" ]; then
            echo "::error file=sdk/python/pyproject.toml::sdk/python/src changed but the version is still $after."
            echo "  The dimagi-canopy-v$after tag hosts pin would no longer describe this code."
            echo "  Bump the version (and canopy_sdk.__version__, and CHANGELOG.md); merging it"
            echo "  releases it (release-dimagi-canopy.yml runs on a version change to main)."
            exit 1
          fi
          echo "dimagi-canopy: src changed and the version moved $before -> $after."

      # A published package whose source moved without its version moving is a
      # SILENT failure, the same class as the stale generated.ts guard above:
      # everything here goes green, the `<pkg>-v*` tag never gets pushed, and
      # the registry keeps serving old code under a version number that no
      # longer describes it.
      #
      # Not hypothetical. On 2026-09-16 the registry's canopy-ui@0.7.0 was
      # missing `agui.ts` and `useSessionSocket`'s `onUnknownEvent` seam, both
      # in-repo at 0.7.0 for weeks. ace-web pinned "0.7.0", believed itself
      # current, and could not receive a `page.invalidate` frame — with nothing
      # anywhere to say why.
      #
      # Covers every publishable workspace rather than canopy-ui alone: the
      # trap is a property of "published to npm", not of that one package, and
      # a guard naming one package has to be remembered for the next.
      # `canopy-widget` is deliberately absent — it is BUILT and served at
      # /canopy/embed/widget.js, never installed, so it has no registry copy to
      # go stale.
      #
      # `fetch-depth: 0` above is what lets this diff against the base.
      - name: Published packages need a version bump when their source changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          failed=0
          for pkg in canopy-ui canopy-client; do
            dir="frontend/packages/$pkg"
            if git diff --quiet "$BASE_SHA"...HEAD -- "$dir/src"; then
              echo "$pkg: src unchanged, no bump needed."
              continue
            fi
            before=$(git show "$BASE_SHA:$dir/package.json" \
              | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
            after=$(node -p "require('./$dir/package.json').version")
            if [ "$before" = "$after" ]; then
              echo "::error file=$dir/package.json::$pkg/src changed but the version is still $after."
              echo "  npm would keep serving the OLD $after, and every consumer pinned to it"
              echo "  silently misses this change. Bump the version here; merging it"
              echo "  publishes it (publish-$pkg.yml runs on a version change to main)."
              failed=1
            else
              echo "$pkg: src changed and the version moved $before -> $after."
            fi
          done
          exit $failed

  # The frontend half of the PR's fast checks: type-check the SPA and run the
  # vitest files that import what this PR changed. Frontend failures were a
  # fifth of merge-queue ejections, each one rebuilding every entry behind it.
  # A change to the toolchain itself (package.json, the lockfile, a vite or ts
  # config) can break any test, so that runs the whole suite instead.
  pr-frontend-checks:
    name: PR frontend checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: What this PR changed in the frontend
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          ALL=$(git diff --name-only --diff-filter=d "$BASE_SHA"...HEAD -- frontend/)
          SRC=$(echo "$ALL" | grep -E '^frontend/.*\.(ts|tsx|js|jsx|mts|css)$' \
            | grep -vE '^frontend/(vite|vitest)[^/]*\.config\.' | sed 's#^frontend/##' | tr '\n' ' ' || true)
          if echo "$ALL" | grep -qE '^frontend/(package(-lock)?\.json|tsconfig[^/]*\.json|vite[^/]*\.config\.[a-z]+)$'; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
          elif [ -n "$ALL" ]; then
            echo "mode=related" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi
          echo "files=$SRC" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.changed.outputs.mode != 'none'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.changed.outputs.mode != 'none'
        working-directory: frontend
        run: npm ci

      # The type-check half of `npm run build`, without the bundling.
      - name: Type check
        if: steps.changed.outputs.mode != 'none'
        working-directory: frontend
        run: npx tsc -b

      - name: Vitest (files related to this PR's changes)
        if: steps.changed.outputs.mode == 'related'
        working-directory: frontend
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: |
          if [ -z "$FILES" ]; then echo "No source files changed."; exit 0; fi
          npx vitest related --run --passWithNoTests $FILES

      - name: Vitest (whole suite — the toolchain changed)
        if: steps.changed.outputs.mode == 'all'
        working-directory: frontend
        run: npm run test

  test-backend-gate:
    name: Backend tests
    needs: [test-backend, test-runner-packages, test-backend-postgres, pr-guards, pr-fast-checks]
    # always(): without it a failed `needs` SKIPS this job, and a skipped
    # required check counts as passing — the gate would wave failures through.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every backend job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, os, sys
          needs = json.load(sys.stdin)
          # On a PR only the PR jobs run (the suites run in the merge queue —
          # see the top of this file); everywhere else everything but them runs.
          # A job that was expected must have SUCCEEDED: skipped is not passed.
          on_pr = os.environ["EVENT"] == "pull_request"
          pr_only = {"pr-guards", "pr-fast-checks"}
          bad = {}
          for job, n in needs.items():
              result = n["result"]
              print(f"{job}: {result}")
              expected = (job in pr_only) == on_pr
              if result != "success" and (expected or result != "skipped"):
                  bad[job] = result
          if bad:
              print(f"::error::job(s) did not pass: {bad}")
              sys.exit(1)
          '

  # `Frontend build` is the name the ruleset requires; like `Backend tests` it
  # is a gate, so the suite itself can skip on a PR.
  test-frontend-gate:
    name: Frontend build
    needs: [test-frontend, pr-guards, pr-frontend-checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every frontend job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, os, sys
          needs = json.load(sys.stdin)
          # On a PR only the PR jobs run (the suites run in the merge queue —
          # see the top of this file); everywhere else everything but them runs.
          # A job that was expected must have SUCCEEDED: skipped is not passed.
          on_pr = os.environ["EVENT"] == "pull_request"
          pr_only = {"pr-guards", "pr-frontend-checks"}
          bad = {}
          for job, n in needs.items():
              result = n["result"]
              print(f"{job}: {result}")
              expected = (job in pr_only) == on_pr
              if result != "success" and (expected or result != "skipped"):
                  bad[job] = result
          if bad:
              print(f"::error::job(s) did not pass: {bad}")
              sys.exit(1)
          '


  # A secret committed in a PR is public to everyone who can read the repo the
  # moment it is pushed, and "rotate it" is the only real remedy — so the point
  # is to say so on the PR, before it merges and spreads into every clone.
  #
  # Scans ONLY this PR's commits (base..head, added lines), never full history:
  # old findings are not this PR's to fix, and a check that fails on them gets
  # ignored. Deliberately NOT a required check (it is not in the ruleset): a
  # heuristic scanner will have false positives, and it must never be able to
  # block the merge queue. Allowlists live in .gitleaks.toml.
  #
  # The gitleaks BINARY, not gitleaks-action: the action needs a paid license
  # for organisation repos. Pinned to a release and checked against its
  # published SHA-256, so a swapped download fails rather than runs.
  secret-scan:
    name: Secret scan (PR diff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # base..head needs both ends in the clone.
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          # From gitleaks_8.30.1_checksums.txt on the v8.30.1 release.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan this PR's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact --config .gitleaks.toml \
            --log-opts="--no-merges ${BASE_SHA}..${HEAD_SHA}"

  # Two shards: vitest's cost on a 4-vCPU runner is per-file setup (a fresh
  # jsdom + module graph for each of ~350 files), not the tests, so it was the
  # queue's longest job (~3–5 min). Shard 1 also builds the SPA and the site.
  # ── Browser suite: chat with a runner ─────────────────────────────────
  #
  # A real browser against the real API on Postgres, with `e2e/fake_runner.py`
  # answering every send as a production runner does (the real runner client,
  # a real Claude transcript, rows shipped with canopy_transcript). It covers
  # what unit tests cannot see: the reply arriving once and in order, the view
  # at the newest row, a finished turn that stops saying it is working, history
  # that survives a dropped connection. Not yet behind a required gate.
  test-e2e-chat:
    name: Browser suite (chat)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: canopy_e2e
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --extra dev

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run the chat browser suite
        working-directory: frontend
        env:
          E2E_DATABASE_URL: postgres://e2e:e2e@127.0.0.1:5432/canopy_e2e
        run: npx playwright test e2e/chat-runner.spec.ts --project=desktop

      - name: Keep the traces of a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-chat-traces
          path: frontend/test-results/
          retention-days: 7

  test-frontend:
    name: Frontend tests (${{ matrix.shard }}/2)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        if: matrix.shard == 1
        working-directory: frontend
        run: npm run build

      - name: Run vitest
        working-directory: frontend
        run: npm run test -- --shard=${{ matrix.shard }}/2

      # The public product site (site/, Astro) — static pages served at / to
      # signed-out visitors. Built here so a broken page fails the PR, not the deploy.
      # Astro needs Node 22; the SPA above still builds on 20, so the site gets
      # its own toolchain rather than moving the whole job.
      - uses: actions/setup-node@v7
        if: matrix.shard == 1
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Build the public site
        if: matrix.shard == 1
        working-directory: site
        run: npm ci && npm run build
