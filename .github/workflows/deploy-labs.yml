name: Deploy to Labs (AWS)

# Deploys canopy-web to the shared labs platform at
# https://labs.connect.dimagi.com/canopy/ (AWS ECS Fargate, account 858923557655).
# Manual-only: trigger via "Run workflow" on the Actions tab. Main-only.
#
# canopy-web is ONE container — the Dockerfile builds the SPA (stage 1) and Django
# serves it via WhiteNoise, plus the API + MCP — so there's a single image / single
# ECR repo (unlike ace-web's split backend/frontend).
#
# The CloudFormation stack (deploy/aws/canopy-web.cfn.yaml) is the one-time
# provisioner (ECR repo, secrets, target group, listener rule, task def, service,
# using the SHARED task/exec roles) AND the single source of truth for the
# container's non-secret environment. This workflow handles every ongoing deploy:
# it sources the live task def, swaps the image, and RE-ASSERTS the non-secret
# env from the committed template (via deploy/aws/render_taskdef.py) so env can't
# drift from the template; secrets/roles/cpu/memory stay CFN-owned and carry
# forward (change them with a stack update). Then it migrates automatically and
# rolls the service.
#
# Required GitHub secrets (see deploy/aws + Phase 2 of the labs migration):
#   AWS_ROLE_ARN         — the shared github-actions-labs-deploy OIDC role.
#                          Since this repo was transferred into the org (2026-07-28)
#                          GitHub mints its OIDC token with an IMMUTABLE subject —
#                          repo:dimagi-internal@272902307/canopy-web@1193139337:* —
#                          NOT the name-based repo:dimagi-internal/canopy-web:*.
#                          The trust policy must allow the immutable form; the
#                          name-based one silently fails with "Not authorized to
#                          perform sts:AssumeRoleWithWebIdentity". Check the live
#                          value with:
#                            gh api repos/dimagi-internal/canopy-web/actions/oidc/customization/sub
#   LABS_SUBNET          — a labs VPC subnet id (for the one-off migration task)
#   LABS_SECURITY_GROUP  — the labs security group id

on:
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: 'EMERGENCY ONLY: skip migrations. They run automatically by default.'
        type: boolean
        required: false
        default: false

# Deploys are serialized (one at a time, never cancelled mid-flight). That makes a
# hung job everyone's problem: it holds this lock and every later deploy queues
# behind it, so the per-job timeout-minutes below are what keep the queue live —
# GitHub's default is 6 HOURS. Seen in the wild: configure-aws-credentials wedged
# for ~55min and blocked the queue until it was cancelled by hand.
concurrency:
  group: deploy-labs-canopy-web
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 858923557655.dkr.ecr.us-east-1.amazonaws.com
  ECS_CLUSTER: labs-jj-cluster
  ECS_SERVICE: labs-jj-canopy-web
  ECR_REPO: labs-jj-canopy-web
  TASK_FAMILY: labs-jj-canopy-web
  CONTAINER_NAME: canopy-web
  CFN_STACK: canopy-web

permissions:
  id-token: write
  contents: read

jobs:
  guard:
    name: Enforce main-only deploys
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check ref is refs/heads/main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Deploys must run from main. Got ref=${{ github.ref }}. Merge to main, then re-run from branch=main."
            exit 1
          fi

      # A workflow_dispatch pins github.sha to main's tip AT DISPATCH TIME, and
      # the image is tagged with it — so "merge a PR and kick a deploy" in one
      # breath can build the PRE-merge commit, deploy green, and ship code that
      # simply isn't there. (Seen in the wild: a management command was missing
      # from a successful deploy.) It is also how a queued deploy can roll prod
      # BACKWARDS past anything merged while it waited. Deploy what main is now,
      # or fail loudly and let a human re-dispatch.
      - name: Refuse to deploy a stale commit
        run: |
          TIP=$(git ls-remote https://github.com/${{ github.repository }} refs/heads/main | cut -f1)
          if [ "$TIP" != "${{ github.sha }}" ]; then
            echo "::error::Stale deploy: this run builds ${{ github.sha }} but main is now $TIP."
            echo "::error::Re-dispatch the deploy so it picks up main's current tip."
            exit 1
          fi
          echo "Deploying main tip $TIP."

  build:
    name: Build & push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: guard
    steps:
      - uses: actions/checkout@v5
        with:
          # `git log -1 -- <path>` needs real history: at the default depth of 1
          # it answers with HEAD or with nothing, so the runner-staleness alert
          # would compare against a sha that has nothing to do with the runner.
          fetch-depth: 0

      # The one quantity both sides of the runner-staleness alert compute (spec
      # 2026-07-28). Path-scoped on purpose — HEAD moves on every canopy-web
      # commit, and comparing that would demand a runner reinstall for a CSS change.
      - name: Resolve runner code sha
        id: runner_sha
        run: |
          SHA="$(git log -1 --format=%H -- runner/canopy_runner/canopy_runner)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          # Committer epoch of the SAME commit, from the same command. A sha is an
          # identity, not a position: without this the supervisor can only say a
          # runner "differs" and was rendering that as "behind" — including for a
          # box installed from main ahead of the deploy, i.e. the most current one.
          TS="$(git log -1 --format=%ct -- runner/canopy_runner/canopy_runner)"
          echo "committed_at=${TS:-0}" >> "$GITHUB_OUTPUT"
          echo "Runner source last changed at ${SHA:-<none>} (${TS:-0})"

      # The same quantity for the OTHER runner. The cloud box is a different
      # program with its own path, so one sha cannot describe both — served
      # per-runner-kind by RunnerOut (spec 2026-07-30).
      #
      # bootstrap_agents.sh is in scope alongside the runner itself: it re-runs on
      # every service start, but nothing ever TRIGGERS a start, so a bootstrap fix
      # ships only when a human happens to restart the box. Including it here is
      # what makes the auto-updater supply that missing event.
      - name: Resolve cloud runner code sha
        id: cloud_sha
        run: |
          PATHS="runner/ec2/cloud_runner.py runner/ec2/bootstrap_agents.sh"
          SHA="$(git log -1 --format=%H -- $PATHS)"
          TS="$(git log -1 --format=%ct -- $PATHS)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "committed_at=${TS:-0}" >> "$GITHUB_OUTPUT"
          echo "Cloud runner source last changed at ${SHA:-<none>} (${TS:-0})"

      # Vendor the canopy plugin into the build context so apps.system can
      # render the /system catalog. canopy is PUBLIC (dimagi-internal/canopy), so
      # this needs no credentials — it used to clone via a CANOPY_PLUGIN_TOKEN PAT
      # back when the repo was private. Clone failure → /system degrades to an
      # empty catalog (the build still succeeds). Mirrors the retired deploy.sh
      # step; the ./canopy dir is picked up by the Dockerfile's `COPY . .`.
      - name: Vendor canopy plugin
        run: |
          rm -rf canopy
          if git clone --depth 1 https://github.com/dimagi-internal/canopy.git canopy; then
            rm -rf canopy/.git
            echo "Vendored canopy plugin into build context."
          else
            echo "::warning::canopy plugin clone failed — /system will show an empty catalog."
          fi

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false
          # canopy-web serves under the /canopy path prefix on the shared ALB.
          # These MUST be passed or the SPA builds with base "/" (assets 404 at
          # /assets/… instead of /canopy/assets/…) and reads the wrong CSRF
          # cookie (writes 403). Mirrors config/settings/connectlabs.py.
          build-args: |
            VITE_BASE_PATH=/canopy/
            VITE_CSRF_COOKIE_NAME=csrftoken_canopy
            RUNNER_CODE_SHA=${{ steps.runner_sha.outputs.sha }}
            RUNNER_CODE_COMMITTED_AT=${{ steps.runner_sha.outputs.committed_at }}
            RUNNER_CLOUD_CODE_SHA=${{ steps.cloud_sha.outputs.sha }}
            RUNNER_CLOUD_CODE_COMMITTED_AT=${{ steps.cloud_sha.outputs.committed_at }}
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:buildcache,mode=max

  deploy:
    name: Deploy to Fargate
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Register migration task definition (image swap only)
        id: register-task
        run: |
          # A THROWAWAY task def used only to run migrations. The real one is
          # registered by CloudFormation in the deploy step below, which owns it.
          #
          # Why this exists at all: CFN's Service references its TaskDefinition, so
          # a stack update rolls BOTH atomically — there is no seam left to migrate
          # in. This gives us one: new code (image swapped) against the current
          # schema, before any traffic moves.
          #
          # Built from the LIVE task def, not the template: no YAML parsing, so the
          # class of bug where a CloudFormation intrinsic silently renders away
          # cannot exist here. The trade is that its ENV is one deploy stale — it
          # is whatever CFN set last time. That only matters if a deploy changes an
          # env var AND a migration in the SAME deploy reads it; migrations operate
          # on schema and essentially never read settings. If it ever happens,
          # deploy twice.
          aws ecs describe-task-definition --task-definition "${{ env.TASK_FAMILY }}" \
            --query 'taskDefinition' --output json > /tmp/live.json

          python3 - <<'PY' > /tmp/migrate-taskdef.json
          import json
          d = json.load(open("/tmp/live.json"))
          for f in ("taskDefinitionArn", "revision", "status", "requiresAttributes",
                    "compatibilities", "registeredAt", "registeredBy"):
              d.pop(f, None)
          for c in d["containerDefinitions"]:
              if c["name"] == "${{ env.CONTAINER_NAME }}":
                  c["image"] = "${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ github.sha }}"
          print(json.dumps(d))
          PY

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/migrate-taskdef.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task-def-arn=$NEW_ARN" >> "$GITHUB_OUTPUT"
          echo "::notice::Migration task def $NEW_ARN"

      - name: Run database migrations
        if: ${{ inputs.skip_migrations != true }}
        run: |
          # Runs on EVERY deploy by default — `migrate --noinput` is idempotent, a
          # near-instant no-op when nothing is pending, so there is no cost to always
          # running it and no way to forget. (A deploy of new code that SELECTs a
          # not-yet-added column is exactly how /api/agents/tasks 500'd in prod when a
          # migration shipped un-run; automatic migration removes that whole failure
          # class.) Escape hatch: skip_migrations=true for the rare emergency.
          #
          # One-off Fargate task on the NEW task def (new code), command overridden to
          # `migrate`. Runs BEFORE the service cutover so new code never serves against
          # an un-migrated schema.
          TASK_ARN=$(aws ecs run-task \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --task-definition "${{ steps.register-task.outputs.task-def-arn }}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.LABS_SUBNET }}],securityGroups=[${{ secrets.LABS_SECURITY_GROUP }}],assignPublicIp=ENABLED}" \
            --overrides '{"containerOverrides":[{"name":"${{ env.CONTAINER_NAME }}","command":["python","manage.py","migrate","--noinput"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: $TASK_ARN"

          aws ecs wait tasks-stopped --cluster "${{ env.ECS_CLUSTER }}" --tasks "$TASK_ARN"

          EXIT=$(aws ecs describe-tasks --cluster "${{ env.ECS_CLUSTER }}" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[?name==`'"${{ env.CONTAINER_NAME }}"'`].exitCode | [0]' --output text)
          if [ "$EXIT" = "0" ]; then
            echo "Migrations completed successfully."
          else
            REASON=$(aws ecs describe-tasks --cluster "${{ env.ECS_CLUSTER }}" --tasks "$TASK_ARN" \
              --query 'tasks[0].stoppedReason' --output text)
            echo "::error::Migrations failed (exit=$EXIT). Stopped reason: $REASON"
            exit 1
          fi

      - name: Install preflight dependencies
        run: pip install --quiet 'boto3>=1.34,<2.0'

      - name: Deploy (CloudFormation owns the task definition + service)
        run: |
          # THREE steps, not one, so the permissions question is asked BEFORE
          # anything is applied.
          #
          # `aws cloudformation deploy` builds a change set and executes it in
          # one go, which is why the 2026-09-09 failure surfaced as a 403 five
          # minutes into a rollout. --no-execute-changeset stops after building
          # it, leaving something we can inspect.
          #
          # We keep `deploy` rather than calling create-change-set directly, and
          # that is deliberate: `deploy` carries a stack's existing parameters
          # forward for us. connect-labs/infra/README.md records a real incident
          # on 2026-08-18 where hand-rolling the parameter list silently removed
          # a stack's alarm-email subscription. `deploy` has no
          # --change-set-name flag (checked against aws-cli 2.34.10), so the
          # change set is located by comparing the newest one before and after.
          # Safe because the workflow's concurrency group serialises deploys.
          set -o pipefail

          newest_change_set () {
            aws cloudformation list-change-sets \
              --stack-name "${{ env.CFN_STACK }}" \
              --query 'sort_by(Summaries,&CreationTime)[-1].ChangeSetId' \
              --output text 2>/dev/null || echo "None"
          }

          BEFORE=$(newest_change_set)

          aws cloudformation deploy \
            --stack-name "${{ env.CFN_STACK }}" \
            --template-file deploy/aws/canopy-web.cfn.yaml \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --no-execute-changeset \
            --parameter-overrides ImageTag="${{ github.sha }}"

          AFTER=$(newest_change_set)
          if [ "$AFTER" = "$BEFORE" ] || [ "$AFTER" = "None" ]; then
            echo "No new change set — nothing to deploy."
            exit 0
          fi
          echo "Change set: $AFTER"

          # The role this job is running as; the same principal that will
          # execute the change set. get-caller-identity returns the ASSUMED-ROLE
          # arn, which simulate-principal-policy does not accept — convert it to
          # the role arn.
          PRINCIPAL=$(aws sts get-caller-identity --query Arn --output text \
            | sed 's|:sts:|:iam:|; s|assumed-role/\([^/]*\)/.*|role/\1|')
          echo "Preflight against: $PRINCIPAL"

          if ! python -m deploy.aws.preflight \
                 --stack "${{ env.CFN_STACK }}" \
                 --change-set "$AFTER" \
                 --principal "$PRINCIPAL"; then
            echo "::error::Deploy preflight failed — nothing was applied. See above."
            aws cloudformation delete-change-set --change-set-name "$AFTER" || true
            exit 1
          fi

          aws cloudformation execute-change-set --change-set-name "$AFTER"

          if ! aws cloudformation wait stack-update-complete \
                 --stack-name "${{ env.CFN_STACK }}"; then
              # Kept verbatim from #723: aws prints only "run describe-stack-events"
              # and exits, so the reason lives behind an API call nobody reading
              # the log can make.
              echo "::group::CloudFormation stack events (most recent first)"
              aws cloudformation describe-stack-events \
                --stack-name "${{ env.CFN_STACK }}" \
                --max-items 40 \
                --query 'StackEvents[?ResourceStatusReason!=`null`].{Time:Timestamp,Resource:LogicalResourceId,Status:ResourceStatus,Reason:ResourceStatusReason}' \
                --output table || echo "(could not read stack events)"
              echo "::endgroup::"
              FAILED=$(aws cloudformation describe-stack-events \
                --stack-name "${{ env.CFN_STACK }}" \
                --max-items 40 \
                --query 'StackEvents[?ResourceStatus==`UPDATE_FAILED`||ResourceStatus==`CREATE_FAILED`]|[0].ResourceStatusReason' \
                --output text 2>/dev/null || true)
              echo "::error::CloudFormation deploy failed. First failing resource said: ${FAILED:-see the stack events above}"
              exit 1
          fi
          echo "Rollout complete — new tasks running and healthy."

      - name: Deployment summary
        run: |
          {
            echo "## Deploy to Labs — canopy-web"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Ref | \`${{ github.ref_name }}\` @ \`${{ github.sha }}\` |"
            echo "| Image | \`${{ env.ECR_REPO }}:${{ github.sha }}\` |"
            echo "| Task definition | \`${{ steps.register-task.outputs.task-def-arn }}\` |"
            echo "| Migrations | \`${{ inputs.skip_migrations == true && 'SKIPPED (emergency)' || 'ran automatically' }}\` |"
            echo "| Service | \`${{ env.ECS_SERVICE }}\` |"
            echo "| URL | https://labs.connect.dimagi.com/canopy/ |"
          } >> "$GITHUB_STEP_SUMMARY"
