name: Publish canopy-client

# Publishes layer 1 of the embedded-agent SDK to the PUBLIC npm registry as the
# UNSCOPED package `canopy-client`. Unscoped for the same reason canopy-ui is:
# the `@canopy` npm scope belongs to somebody else, so `@canopy/client` — the
# name this package shipped with — was never publishable. See the header of
# frontend/packages/canopy-client/src/index.ts.
#
# Auth is OIDC Trusted Publishing — NO stored token, matching
# publish-canopy-ui.yml. GitHub Actions mints a short-lived OIDC token that npm
# trusts, so there is no NPM_TOKEN secret to leak (and this repo has none —
# `gh secret list` is AWS-only).
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ ONE-TIME SETUP, REQUIRED BEFORE THE FIRST RUN OF THIS WORKFLOW.         │
# │                                                                         │
# │ Trusted Publishing is configured on the npm PACKAGE, so a package that  │
# │ has never been published has nowhere to configure it. Someone with the  │
# │ npm account that owns canopy-ui (jjackson_dimagi) must do ONE of:       │
# │                                                                         │
# │  a) npmjs.com → Add package → reserve `canopy-client`, then its         │
# │     Settings → Trusted Publisher → GitHub Actions → repo               │
# │     `dimagi-internal/canopy-web`, workflow `publish-canopy-client.yml`; │
# │     then run this workflow. Preferred — no token is ever created.       │
# │                                                                         │
# │  b) publish 0.1.0 once from a laptop (`npm publish --access public`     │
# │     from frontend/packages/canopy-client), then configure the trusted   │
# │     publisher as above so every LATER release goes through here.        │
# │                                                                         │
# │ Until that is done this workflow fails at the publish step with a 404   │
# │ or an auth error — which is the correct failure, not a bug to work      │
# │ around by adding a long-lived token.                                    │
# │                                                                         │
# │ STATUS 2026-09-18: 0.1.0 was published by hand (option b's first half), │
# │ so the package exists. Whether its Trusted Publisher is configured is   │
# │ answered by this workflow's first run for 0.2.0.                       │
# └─────────────────────────────────────────────────────────────────────────┘
#
# **A release is a version bump reaching main**, exactly as for canopy-ui —
# see the header of publish-canopy-ui.yml for why the old "merge, then push a
# tag" step was removed (it was skipped, and canopy-ui 0.10.0 sat unpublished
# while ace-web, which consumes BOTH packages, stayed behind). CI already
# refuses a src change that does not move the version.
#
# Idempotent: the check job asks npm whether this version exists, and the
# publish job runs only if it does not. The tag is written after a successful
# publish, with GITHUB_TOKEN, which triggers no workflow. `workflow_dispatch`
# re-runs it by hand.
on:
  push:
    branches: [main]
    paths: ['frontend/packages/canopy-client/package.json']
  workflow_dispatch:

permissions:
  contents: write   # the release tag
  id-token: write   # required for OIDC Trusted Publishing

# Two merges in quick succession must not race to publish.
concurrency:
  group: publish-canopy-client
  cancel-in-progress: false

jobs:
  check:
    name: Is this version already on npm?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          v=$(node -p "require('./frontend/packages/canopy-client/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$(npm view "canopy-client@$v" version 2>/dev/null)" = "$v" ]; then
            echo "canopy-client@$v is already on npm — nothing to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "canopy-client@$v is not on npm yet — releasing it."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish to npmjs
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Trusted Publishing + provenance need npm >= 11.5.1. npm@latest is now v12
      # (requires node >= 22), so pin the major and keep node new enough for it.
      - name: Upgrade npm
        run: npm install -g npm@11

      # Its own suite is the gate before it leaves the building. Two tests
      # carry the weight: `dependency-free.test.ts` keeps the promise the
      # package is FOR (zero runtime dependencies, so a React-18 or
      # no-framework host can install it), and `published-build.test.ts` builds
      # the real artifact and loads it in plain Node — the check 0.1.0 lacked.
      - name: Install workspace + test
        working-directory: frontend
        run: |
          npm ci
          npx vitest run packages/canopy-client

      # Publish the BUILD, not the source. 0.1.0 shipped raw TypeScript and
      # failed in connect-labs' webpack, which (like most) does not compile
      # node_modules. See scripts/build-dist.mjs.
      - name: Build
        working-directory: frontend/packages/canopy-client
        run: node scripts/build-dist.mjs dist

      - name: Publish (OIDC, with provenance)
        run: npm publish ./dist --access public --provenance
        working-directory: frontend/packages/canopy-client

      - name: Tag the release
        env:
          TAG: canopy-client-v${{ needs.check.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists — leaving it."
          else
            git tag "$TAG" && git push origin "$TAG"
          fi
