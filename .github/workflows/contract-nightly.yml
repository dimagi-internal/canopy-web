name: Contract tests (nightly, exhaustive)

# Contract tests do NOT run on PRs — ci.yml has no live backend, so the suite
# skips there (schemathesis.from_uri can't reach a server). This job is the only
# place they actually execute: the EXHAUSTIVE property-based fuzz against a live
# server, nightly + on demand, off the PR critical path. (A fast in-process smoke
# on PRs via schemathesis.from_wsgi is a possible future add.)

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily
  workflow_dispatch:
    inputs:
      max_examples:
        description: "Schemathesis examples per endpoint"
        required: false
        default: "100"

jobs:
  contract-tests-nightly:
    name: Contract tests (Schemathesis, exhaustive)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: canopy_web
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Apply migrations
        run: uv run python manage.py migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/canopy_web
          DJANGO_SETTINGS_MODULE: config.settings.production
          SECRET_KEY: ci-secret
          ALLOWED_HOSTS: localhost,127.0.0.1
          AUTH_ALLOWED_EMAIL_DOMAIN: dimagi-ai.com
          REQUIRE_AUTH: "False"

      - name: Mint PAT for schemathesis
        id: pat
        run: |
          RAW=$(uv run python manage.py create_token \
            --email ace@dimagi-ai.com --label schemathesis-ci --create-user \
            | tail -1)
          echo "::add-mask::$RAW"
          echo "raw=$RAW" >> $GITHUB_OUTPUT
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/canopy_web
          DJANGO_SETTINGS_MODULE: config.settings.production
          SECRET_KEY: ci-secret
          ALLOWED_HOSTS: localhost,127.0.0.1
          AUTH_ALLOWED_EMAIL_DOMAIN: dimagi-ai.com

      - name: Start backend
        run: |
          uv run python manage.py runserver 0.0.0.0:8000 > /tmp/runserver.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/api/openapi.json > /dev/null; then
              echo "backend up"
              break
            fi
            sleep 1
          done
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/canopy_web
          DJANGO_SETTINGS_MODULE: config.settings.production
          SECRET_KEY: ci-secret
          ALLOWED_HOSTS: localhost,127.0.0.1
          AUTH_ALLOWED_EMAIL_DOMAIN: dimagi-ai.com
          REQUIRE_AUTH: "True"

      # Schemathesis is installed HERE, not in the project's dev extra.
      #
      # It talks to a live server over HTTP and imports no canopy code, but as a
      # dev dependency it shared production's resolution and pinned
      # `starlette<1` — which blocked FastMCP 4, and with it mcp SDK 2.2 and
      # resource subscriptions. Every schemathesis 4.x also wants pytest>=9. A
      # nightly fuzz tool must not get to pin the production MCP library, so it
      # lives in its own environment with its own pytest.
      - name: Install schemathesis (isolated from the project graph)
        run: |
          uv venv /tmp/contract-env
          VIRTUAL_ENV=/tmp/contract-env uv pip install "schemathesis>=4.27,<5.0" "pytest>=9,<10"
          # Minimal config on purpose: this suite talks to a live server over
          # HTTP and imports no canopy code, so it must not inherit the
          # project's DJANGO_SETTINGS_MODULE / asyncio_mode — whose plugins are
          # deliberately absent from this environment.
          printf '[pytest]\npython_files = test_*.py\n' > /tmp/contract-pytest.ini

      - name: Run schemathesis (exhaustive)
        run: /tmp/contract-env/bin/pytest -c /tmp/contract-pytest.ini tests/contract/ -v
        env:
          SCHEMATHESIS_SCHEMA_URL: http://localhost:8000/api/openapi.json
          SCHEMATHESIS_AUTH_BEARER: ${{ steps.pat.outputs.raw }}
          SCHEMATHESIS_MAX_EXAMPLES: ${{ github.event.inputs.max_examples || '100' }}
