name: Contract tests (nightly, exhaustive)

# Contract tests do NOT run on PRs — ci.yml has no live backend, so the suite
# skips there (schemathesis.from_uri can't reach a server). This job is the only
# place they actually execute: the EXHAUSTIVE property-based fuzz against a live
# server, nightly + on demand, off the PR critical path. (A fast in-process smoke
# on PRs via schemathesis.from_wsgi is a possible future add.)

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily
  workflow_dispatch:
    inputs:
      max_examples:
        description: "Schemathesis examples per endpoint"
        required: false
        default: "100"

# Checks out and fuzzes a local server. The one write back to GitHub is the
# failure issue below (issues: write); it never touches the repo's contents.
permissions:
  contents: read
  issues: write

jobs:
  contract-tests-nightly:
    name: Contract tests (Schemathesis, exhaustive)
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector: migration agents/0064 creates the `vector` extension.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: canopy_web
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Apply migrations
        run: uv run python manage.py migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/canopy_web
          DJANGO_SETTINGS_MODULE: config.settings.production
          SECRET_KEY: ci-secret
          ALLOWED_HOSTS: localhost,127.0.0.1
          AUTH_ALLOWED_EMAIL_DOMAIN: dimagi-ai.com
          REQUIRE_AUTH: "False"

      - name: Mint PAT for schemathesis
        id: pat
        run: |
          RAW=$(uv run python manage.py create_token \
            --email ace@dimagi-ai.com --label schemathesis-ci --create-user \
            | tail -1)
          echo "::add-mask::$RAW"
          echo "raw=$RAW" >> $GITHUB_OUTPUT
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/canopy_web
          DJANGO_SETTINGS_MODULE: config.settings.production
          SECRET_KEY: ci-secret
          ALLOWED_HOSTS: localhost,127.0.0.1
          AUTH_ALLOWED_EMAIL_DOMAIN: dimagi-ai.com

      # Push answers 503 "not configured" without VAPID keys, which is right for
      # a push-less deployment but means the fuzz never reaches its real path.
      # A throwaway pair, made here and never stored, lets it.
      - name: Make throwaway VAPID keys
        run: |
          uv run python - >> "$GITHUB_ENV" <<'EOF'
          import base64
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import ec
          b64 = lambda b: base64.urlsafe_b64encode(b).rstrip(b"=").decode()
          key = ec.generate_private_key(ec.SECP256R1())
          print("VAPID_PRIVATE_KEY=" + b64(key.private_numbers().private_value.to_bytes(32, "big")))
          print("VAPID_PUBLIC_KEY=" + b64(key.public_key().public_bytes(
              serialization.Encoding.X962, serialization.PublicFormat.UncompressedPoint)))
          EOF

      - name: Start backend
        run: |
          uv run python manage.py runserver 0.0.0.0:8000 > /tmp/runserver.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/api/openapi.json > /dev/null; then
              echo "backend up"
              break
            fi
            sleep 1
          done
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/canopy_web
          DJANGO_SETTINGS_MODULE: config.settings.production
          SECRET_KEY: ci-secret
          ALLOWED_HOSTS: localhost,127.0.0.1
          AUTH_ALLOWED_EMAIL_DOMAIN: dimagi-ai.com
          REQUIRE_AUTH: "True"

      # A create with no workspace named lands in the caller's SOLE workspace;
      # with none it answers 422 workspace-required, and with two it refuses as
      # ambiguous, so either way the fuzz stops at the door. The CI user is the
      # first user, so it owns the default workspace (`dimagi`) — but that is made
      # lazily, on whichever request first asks, so make it NOW: made mid-run, it
      # would be a second workspace. Then use it, make one through the API if
      # there is none, and fail loudly on two. The suite keeps it sole and intact
      # (test_schemathesis.py).
      - name: Give the CI user exactly one workspace
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/canopy_web
          DJANGO_SETTINGS_MODULE: config.settings.production
          SECRET_KEY: ci-secret
          ALLOWED_HOSTS: localhost,127.0.0.1
          AUTH_ALLOWED_EMAIL_DOMAIN: dimagi-ai.com
        run: |
          uv run python manage.py shell -c \
            "from apps.workspaces.services import ensure_default_workspace; print('default workspace:', ensure_default_workspace())"
          API=http://localhost:8000/api/workspaces/
          AUTH="Authorization: Bearer ${{ steps.pat.outputs.raw }}"
          SLUGS=$(curl -fsS "$API" -H "$AUTH" | jq -r '.[].slug')
          if [ -z "$SLUGS" ]; then
            curl -fsS -X POST "$API" -H "$AUTH" -H "Content-Type: application/json" \
              -d '{"slug": "contract-ci", "display_name": "Contract CI"}' > /dev/null
            SLUGS=contract-ci
          fi
          if [ "$(echo "$SLUGS" | wc -l)" -ne 1 ]; then
            echo "::error::the CI user is in more than one workspace: $SLUGS"; exit 1
          fi
          echo "CI user's workspace: $SLUGS"
          echo "SCHEMATHESIS_CI_WORKSPACE=$SLUGS" >> "$GITHUB_ENV"

      # Schemathesis is installed HERE, not in the project's dev extra.
      #
      # It talks to a live server over HTTP and imports no canopy code, but as a
      # dev dependency it shared production's resolution and pinned
      # `starlette<1` — which blocked FastMCP 4, and with it mcp SDK 2.2 and
      # resource subscriptions. Every schemathesis 4.x also wants pytest>=9. A
      # nightly fuzz tool must not get to pin the production MCP library, so it
      # lives in its own environment with its own pytest.
      - name: Install schemathesis (isolated from the project graph)
        run: |
          uv venv /tmp/contract-env
          VIRTUAL_ENV=/tmp/contract-env uv pip install "schemathesis>=4.27,<5.0" "pytest>=9,<10"
          # Minimal config on purpose: this suite talks to a live server over
          # HTTP and imports no canopy code, so it must not inherit the
          # project's DJANGO_SETTINGS_MODULE / asyncio_mode — whose plugins are
          # deliberately absent from this environment.
          printf '[pytest]\npython_files = test_*.py\n' > /tmp/contract-pytest.ini

      - name: Run schemathesis (exhaustive)
        run: /tmp/contract-env/bin/pytest -c /tmp/contract-pytest.ini --confcutdir=tests/contract tests/contract/ -v
        env:
          SCHEMATHESIS_SCHEMA_URL: http://localhost:8000/api/openapi.json
          SCHEMATHESIS_AUTH_BEARER: ${{ steps.pat.outputs.raw }}
          SCHEMATHESIS_MAX_EXAMPLES: ${{ github.event.inputs.max_examples || '100' }}
      # A red nightly that nobody sees is not a check. On main only (a dispatch on
      # a branch is someone trying a change, and is watched by whoever ran it),
      # keep ONE open issue with a fixed title: open it on the first failure,
      # comment on it for each later one. A passing scheduled run closes it.
      - name: Open or update the failure issue
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Contract nightly failing"
          N=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" \
                --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$N" ]; then
            gh issue comment "$N" --repo "$GITHUB_REPOSITORY" \
              --body "Failed again ($GITHUB_EVENT_NAME, $(git rev-parse --short HEAD)): $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$(printf '%s\n\n%s\n\n%s' \
              "The nightly contract job (.github/workflows/contract-nightly.yml) failed on main: $RUN_URL" \
              "Failing endpoints are in the run's \"Run schemathesis\" step log (gh run view <id> --log-failed). Fix the server, or exclude a check per endpoint in tests/contract/test_schemathesis.py with its reason." \
              "This issue gets a comment on each later failure and is closed by the next passing scheduled run.")"
          fi

      - name: Close the failure issue
        if: success() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Contract nightly failing"
          N=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" \
                --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$N" ]; then
            gh issue close "$N" --repo "$GITHUB_REPOSITORY" --comment "Passing again: $RUN_URL"
          fi
