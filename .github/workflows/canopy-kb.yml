name: canopy_kb tests

# The knowledge-base engine's own suite (packages/canopy_kb), run by hand while
# working on the KB — not on every PR. canopy-web's serving of it (tests/test_kb_*.py,
# tests/test_project_mcp.py) stays in ci.yml. Run: gh workflow run "canopy_kb tests" --ref <branch>
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canopy-kb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # Django-free, as the package is; [prep] brings the curator toolkit's format
      # readers, so their tests run too.
      - name: Run canopy_kb tests
        working-directory: packages/canopy_kb
        run: uv run --extra prep --with pytest pytest -q
