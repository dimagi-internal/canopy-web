# One on-demand capability, in one of two modes (parameter Mode):
#
# persistent (the default) — a dedicated EC2 instance that is stopped when idle
#   and started by its consumer (canopy_sdk.ondemand.OnDemandInstance), plus the
#   IAM policy that lets the consumer drive it. Generalised from ace-web's
#   deploy/aws/ace-mobile.cfn.yaml. Existing stacks (labs-emod) deploy exactly the
#   resources they always had: every ephemeral-only change below is behind a
#   condition, and tests/ondemand/test_template_modes.py renders this mode
#   against the pre-mode template and requires the two to be identical.
#
# ephemeral — NO instance. A launch template a broker (canopy-web's capability
#   leases, canopy_sdk.ondemand.EphemeralInstance) launches a fresh instance from
#   per lease and terminates after. The contract is
#   docs/architecture/capabilities.md in canopy-web; in short:
#     - Outputs LaunchTemplateId, ArtifactsBucketName, InstanceRoleArn, Capability
#       (plus Owner and InstanceRoleId, which the broker also reads);
#     - instances are tagged canopy:capability=<Capability>, canopy:owner=<Owner>;
#     - the AMI is resolved AT LAUNCH from the SSM parameter
#       /canopy/capabilities/<Owner>/<Capability>/ami, so a rebake writes that
#       parameter and nothing is ever re-pinned;
#     - a halt terminates the instance (InstanceInitiatedShutdownBehavior);
#     - BrokerPolicy, attached to BrokerRoleName, is everything the broker may do,
#       and only to instances carrying this capability's and owner's tags;
#     - the broker runs commands only through this stack's exec document
#       (ExecDocument), which runs an argv only if argv[0] is on ExecAllow;
#     - each instance reads and writes only its OWN prefix,
#       vm/<InstanceRoleId>:<instance-id>/ (its aws:userid): ready.json, and each
#       lease's in/, out/ and exec/ under lease/<lease-id>/ (LeaseObjectScope);
#     - the instance role carries exactly what the SSM agent needs, and is
#       explicitly denied ssm:GetParameter* (no reading the account's
#       parameters, encrypted or not).
#   There is no CloudWatch idle alarm in this mode: an alarm names one
#   InstanceId, and these instances do not exist when the stack is deployed.
#   Machine-side, the image halts at max_lifetime_s, and a halt terminates
#   (shutdown behaviour). The broker's sweep terminates any tagged instance
#   without a live lease. And BackstopFunction — a scheduled Lambda owned by
#   this stack, so it works while the broker is down or gone — terminates every
#   instance carrying this capability's and owner's tags that is older than
#   MaxInstanceLifetimeSeconds, every 5 minutes.
#
# Either mode: no SSH key, no inbound security-group rule — the instance is
# reached only through SSM.
#
# Idle shutdown (persistent) has three layers:
#   1. the consumer stops the instance when it is done (OnDemandInstance.stop);
#   2. the in-VM watchdog (idle-shutdown.sh + ondemand-idle-shutdown.timer,
#      baked into the AMI) halts it once /var/run/<Capability>/last-activity is
#      older than IDLE_SECONDS; InstanceInitiatedShutdownBehavior=stop turns that
#      halt into a stop;
#   3. IdleStopAlarm below stops it after 5 minutes of <5% max CPU.
# Nothing in persistent mode ever terminates the instance.
#
# Deploy (needs CAPABILITY_NAMED_IAM, for the named role and policy):
#   aws cloudformation deploy --stack-name ondemand-<capability> \
#     --template-file ondemand-capability.cfn.yaml --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides Capability=<capability> OwnerTag=<owner> AmiId=ami-... \
#       InstanceType=... VpcId=vpc-... SubnetId=subnet-... ConsumerTaskRoleName=<role>
#
#   ephemeral:
#   aws cloudformation deploy --stack-name canopy-cap-<owner>-<capability> \
#     --template-file ondemand-capability.cfn.yaml --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides Mode=ephemeral Capability=<capability> Owner=<agent-slug> \
#       OwnerTag=<who-to-ask> InstanceType=... VpcId=vpc-... SubnetId=subnet-... \
#       ExecAllow=<cli>[,<cli>...] BrokerRoleName=<the broker's role, e.g. canopy-web-task-role>
AWSTemplateFormatVersion: "2010-09-09"
Description: >
  An on-demand capability runner (canopy_sdk.ondemand): a stopped-when-idle EC2
  instance with an egress-only security group, an SSM-managed instance role, an
  S3 artifacts bucket, a CloudWatch idle-stop alarm, and the consumer's IAM
  policy, scoped by the instance's capability tag.

# AmiId defaults to "" (ephemeral stacks take their AMI from SSM), so cfn-lint's
# W1030 sees an empty ImageId on the persistent branch. The
# PersistentNeedsAnAmiAndAConsumer rule refuses that at deploy; cfn-lint does
# not evaluate Rules.
Metadata:
  cfn-lint:
    config:
      ignore_checks: [W1030]

Parameters:
  Mode:
    Type: String
    Description: >
      persistent: one stopped-when-idle instance (OnDemandInstance). ephemeral: no
      instance; a launch template a broker launches per lease and terminates after
      (EphemeralInstance).
    AllowedValues: [persistent, ephemeral]
    Default: persistent
  Capability:
    Type: String
    Description: >
      The capability's name (e.g. emod, ace-mobile). Tags the instance, names the
      resources, and must match the consumer's OnDemandInstance(capability=...):
      the AMI's ready file is /run/<Capability>/ready and the idle marker is
      /var/run/<Capability>/last-activity.
    AllowedPattern: "^[a-z0-9][a-z0-9-]{0,30}$"
    ConstraintDescription: 1-31 lowercase letters, digits or hyphens.
  OwnerTag:
    Type: String
    Description: Value of the `owner` tag on every resource (who to ask about it).
    MinLength: 1
  Owner:
    Type: String
    Description: >
      ephemeral only: the agent that owns the capability (its canopy slug). Tags
      instances canopy:owner and names the AMI parameter
      /canopy/capabilities/<Owner>/<Capability>/ami.
    AllowedPattern: "^([a-z0-9][a-z0-9_-]{0,39})?$"
    ConstraintDescription: empty, or 1-40 lowercase letters, digits, hyphens or underscores.
    Default: ""
  AmiId:
    Type: String
    Description: >
      persistent only: the capability's AMI, in the stack's region. It must run the
      SSM agent, install the idle watchdog units, and create the ready file when
      the capability is up. The root volume is mapped at /dev/sda1 (Ubuntu HVM).
      Ephemeral stacks leave it empty: their AMI comes from the SSM parameter.
    AllowedPattern: "^(ami-[0-9a-f]{8,17})?$"
    ConstraintDescription: empty, or an AMI id (ami-...).
    Default: ""
  InstanceType:
    Type: String
    Description: EC2 instance type. Nested virtualization needs an m8i/c8i/r8i-class type.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC that owns SubnetId.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet for the instance. Needs outbound 443 to reach SSM and S3.
  ConsumerTaskRoleName:
    Type: String
    Description: >
      persistent only: name of the consumer's existing IAM role (e.g. its ECS task
      role). This stack does not own it; it only attaches ConsumerPolicy to it.
    Default: ""
  BrokerRoleName:
    Type: String
    Description: >
      ephemeral only: name of the broker's existing IAM role (for canopy-web,
      its own task role, canopy-web-task-role). This stack does not own it; it
      only attaches BrokerPolicy to it.
    Default: ""
  ExecAllow:
    Type: String
    Description: >
      ephemeral only: the commands an exec may run, comma-separated bare names on
      the image's PATH (the manifest's exec.allow, e.g. "ace-mobile"). The exec
      document refuses any argv whose argv[0] is not exactly one of them, so even
      the broker's role cannot run anything else on these machines. canopy-web
      refuses a publish whose manifest allows a command this list does not.
    AllowedPattern: "^([A-Za-z0-9][A-Za-z0-9._+-]{0,63}(,[A-Za-z0-9][A-Za-z0-9._+-]{0,63})*)?$"
    ConstraintDescription: empty, or comma-separated command names (letters, digits, . _ + -).
    Default: ""
  MaxInstanceLifetimeSeconds:
    Type: Number
    Description: >
      ephemeral only: the stack's own backstop (BackstopFunction) terminates any of
      this capability's instances older than this, whatever the broker thinks.
      Keep it above the manifest's limits.max_lease_s (canopy-web refuses a
      publish otherwise); the default is 4 h plus 30 min of slack.
    MinValue: 600
    MaxValue: 259200
    Default: 16200
  UserData:
    Type: String
    Description: Base64-encoded EC2 user data for the launch template. Empty for none.
    Default: ""
  NestedVirtualization:
    Type: String
    Description: '"true" enables nested virtualization (KVM inside the instance).'
    AllowedValues: ["true", "false"]
    Default: "false"
  RootVolumeGb:
    Type: Number
    Description: Root volume size in GiB (encrypted gp3).
    MinValue: 8
    Default: 30
  IdleStopMinutes:
    Type: Number
    Description: >-
      persistent only: minutes of max CPU below 5% before the CloudWatch backstop
      stops the instance. Matches the in-VM watchdog's 3600 s default, so a box
      stays warm between interactive requests.
    MinValue: 5
    Default: 60

Rules:
  PersistentNeedsAnAmiAndAConsumer:
    RuleCondition: !Equals [!Ref Mode, persistent]
    Assertions:
      - Assert: !Not [!Equals [!Ref AmiId, ""]]
        AssertDescription: persistent mode needs AmiId.
      - Assert: !Not [!Equals [!Ref ConsumerTaskRoleName, ""]]
        AssertDescription: persistent mode needs ConsumerTaskRoleName.
  EphemeralNeedsAnOwnerAndABroker:
    RuleCondition: !Equals [!Ref Mode, ephemeral]
    Assertions:
      - Assert: !Not [!Equals [!Ref Owner, ""]]
        AssertDescription: ephemeral mode needs Owner (the agent's slug).
      - Assert: !Not [!Equals [!Ref BrokerRoleName, ""]]
        AssertDescription: ephemeral mode needs BrokerRoleName.
      - Assert: !Not [!Equals [!Ref ExecAllow, ""]]
        AssertDescription: ephemeral mode needs ExecAllow (the manifest's exec.allow, comma-separated).

Conditions:
  WantsNestedVirtualization: !Equals [!Ref NestedVirtualization, "true"]
  HasUserData: !Not [!Equals [!Ref UserData, ""]]
  IsEphemeral: !Equals [!Ref Mode, ephemeral]
  IsPersistent: !Not [!Equals [!Ref Mode, ephemeral]]

Resources:
  # No ingress rules. Access is via SSM only.
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    # Retained with the instance: deleting it under a retained instance would
    # fail the stack delete (SG still attached) / strip the instance's SSM
    # credentials (role, profile).
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # Ephemeral: a generated name, so two owners' stacks for one capability
      # name can live in one account.
      GroupName: !If [IsEphemeral, !Ref "AWS::NoValue", !Sub "ondemand-${Capability}"]
      GroupDescription: !Sub "Egress-only SG for the ${Capability} on-demand runner. SSM only - no inbound."
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - Description: "Outbound HTTPS for SSM, S3, package mirrors."
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - Description: "Outbound HTTPS for SSM, S3, package mirrors."
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIpv6: "::/0"
        - Description: "Outbound DNS (UDP) for in-VM lookups."
          IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0
      Tags:
        - { Key: owner, Value: !Ref OwnerTag }
        - { Key: capability, Value: !Ref Capability }
        - { Key: managed-by, Value: cloudformation }
        - { Key: Name, Value: !Sub "ondemand-${Capability}" }

  # Attached to the instance: lets the SSM agent register, and lets the
  # capability upload artifacts to its bucket. Nothing else.
  InstanceRole:
    Type: AWS::IAM::Role
    # Retained with the instance: deleting it under a retained instance would
    # fail the stack delete (SG still attached) / strip the instance's SSM
    # credentials (role, profile).
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: !If [IsEphemeral, !Ref "AWS::NoValue", !Sub "ondemand-${Capability}-instance"]
      Description: !Sub "EC2 instance role for the ${Capability} on-demand runner."
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      # Ephemeral: NOT AmazonSSMManagedInstanceCore. That policy grants
      # ssm:GetParameter(s) on "*", and with the account's default aws/ssm key
      # policy any process on a lease machine could then decrypt every
      # SecureString parameter in the account. ssm-agent below carries exactly
      # what the agent needs instead.
      ManagedPolicyArns: !If
        - IsEphemeral
        - !Ref "AWS::NoValue"
        - - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
      Policies: !If
        - IsEphemeral
        - - PolicyName: ssm-agent
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                # AmazonSSMManagedInstanceCore (v2) minus ssm:GetParameter(s),
                # ssm:GetDeployablePatchSnapshotForInstance (Patch Manager) and
                # ssm:PutConfigurePackageResult (Distributor): registration, Run
                # Command (ec2messages), Session Manager (ssmmessages), and the
                # association / inventory calls the agent makes on its own.
                - Sid: SsmAgentCore
                  Effect: Allow
                  Action:
                    - ssm:UpdateInstanceInformation
                    - ssm:ListInstanceAssociations
                    - ssm:DescribeAssociation
                    - ssm:ListAssociations
                    - ssm:GetDocument
                    - ssm:DescribeDocument
                    - ssm:GetManifest
                    - ssm:PutInventory
                    - ssm:PutComplianceItems
                    - ssm:UpdateAssociationStatus
                    - ssm:UpdateInstanceAssociationStatus
                  Resource: "*"
                - Sid: SsmAgentMessages
                  Effect: Allow
                  Action:
                    - ec2messages:AcknowledgeMessage
                    - ec2messages:DeleteMessage
                    - ec2messages:FailMessage
                    - ec2messages:GetEndpoint
                    - ec2messages:GetMessages
                    - ec2messages:SendReply
                    - ssmmessages:CreateControlChannel
                    - ssmmessages:CreateDataChannel
                    - ssmmessages:OpenControlChannel
                    - ssmmessages:OpenDataChannel
                  Resource: "*"
                # Explicit, so no later grant (a managed policy attached by hand,
                # a broader statement) can hand a lease machine the account's
                # parameters. The AMI parameter is resolved by EC2 for the
                # broker at launch; the machine never needs it.
                - Sid: NoParameterReads
                  Effect: Deny
                  Action:
                    - ssm:GetParameter
                    - ssm:GetParameters
                    - ssm:GetParametersByPath
                    - ssm:GetParameterHistory
                  Resource: "*"
          # Each instance reads and writes only its OWN prefix. An instance role
          # cannot read its instance's tags, so the scope is the session:
          # ${aws:userid} for an instance-profile session is
          # "<role id>:<instance id>". Under it: ready.json (which the broker
          # reads at vm/<InstanceRoleId>:<instance id>/ready.json) and, per
          # lease, lease/<lease id>/in/ (what the broker staged), out/ (what the
          # machine produced) and exec/ (each command's streams, written by the
          # SSM agent). So one machine can neither read another lease's inputs
          # nor overwrite its results.
          - PolicyName: lease-artifacts
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: OwnPrefixReadWrite
                  Effect: Allow
                  Action: [s3:PutObject, s3:GetObject, s3:AbortMultipartUpload]
                  Resource: !Sub "${ArtifactsBucket.Arn}/vm/${!aws:userid}/*"
                # The SSM agent checks the bucket's encryption before it uploads
                # a command's output.
                - Sid: BucketMetadata
                  Effect: Allow
                  Action: [s3:GetEncryptionConfiguration, s3:GetBucketLocation]
                  Resource: !GetAtt ArtifactsBucket.Arn
        - - PolicyName: artifacts-put
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: ArtifactsPutObject
                  Effect: Allow
                  Action: [s3:PutObject, s3:AbortMultipartUpload]
                  Resource: !Sub "${ArtifactsBucket.Arn}/*"
                # The box reads what the consumer stages (requests, worker files).
                - Sid: ArtifactsGetObject
                  Effect: Allow
                  Action: [s3:GetObject]
                  Resource: !Sub "${ArtifactsBucket.Arn}/*"
                - Sid: ArtifactsListBucket
                  Effect: Allow
                  Action: [s3:ListBucket, s3:GetBucketLocation]
                  Resource: !GetAtt ArtifactsBucket.Arn
      Tags:
        - { Key: owner, Value: !Ref OwnerTag }
        - { Key: capability, Value: !Ref Capability }
        - { Key: managed-by, Value: cloudformation }

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    # Retained with the instance: deleting it under a retained instance would
    # fail the stack delete (SG still attached) / strip the instance's SSM
    # credentials (role, profile).
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      InstanceProfileName: !If [IsEphemeral, !Ref "AWS::NoValue", !Sub "ondemand-${Capability}-instance"]
      Roles:
        - !Ref InstanceRole

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !If
        - IsEphemeral
        - !Sub "canopy-cap-${Owner}-${Capability}"
        - !Sub "ondemand-${Capability}"
      # Tags the launch template itself. (AWS::IAM::ManagedPolicy and
      # AWS::IAM::InstanceProfile have no Tags property in CloudFormation, so
      # ConsumerPolicy and InstanceProfile are the only untagged resources.)
      TagSpecifications:
        - ResourceType: launch-template
          Tags:
            - { Key: owner, Value: !Ref OwnerTag }
            - { Key: capability, Value: !Ref Capability }
            - { Key: managed-by, Value: cloudformation }
      VersionDescription: !If
        - IsEphemeral
        - !Sub "${Capability} capability (${Owner}) - one instance per lease, SSM-only, terminates on shutdown."
        - !Sub "${Capability} on-demand runner - SSM-only, stops on shutdown."
      LaunchTemplateData:
        # Ephemeral: EC2 resolves the parameter at EVERY launch, so a rebake
        # (which writes it) takes effect on the next lease with no stack update.
        ImageId: !If
          - IsEphemeral
          - !Sub "resolve:ssm:/canopy/capabilities/${Owner}/${Capability}/ami"
          - !Ref AmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        # Persistent puts the subnet on the Instance resource; ephemeral has no
        # Instance resource, so the subnet travels in the launch template, and a
        # launch-template network interface carries its own security groups.
        SecurityGroupIds: !If
          - IsEphemeral
          - !Ref "AWS::NoValue"
          - - !GetAtt SecurityGroup.GroupId
        NetworkInterfaces: !If
          - IsEphemeral
          - - DeviceIndex: 0
              SubnetId: !Ref SubnetId
              Groups:
                - !GetAtt SecurityGroup.GroupId
              DeleteOnTermination: true
          - !Ref "AWS::NoValue"
        # A halt (the in-VM watchdog's `shutdown -h now`) STOPS a persistent
        # instance and TERMINATES an ephemeral one.
        InstanceInitiatedShutdownBehavior: !If [IsEphemeral, terminate, stop]
        # Detailed (1-minute) monitoring. Basic monitoring publishes CPU only
        # every 5 minutes, which IdleStopAlarm's 60 s periods would see as
        # missing data (notBreaching) and never fire on.
        Monitoring:
          Enabled: true
        UserData: !If [HasUserData, !Ref UserData, !Ref "AWS::NoValue"]
        CpuOptions: !If
          - WantsNestedVirtualization
          - NestedVirtualization: enabled
          - !Ref "AWS::NoValue"
        BlockDeviceMappings:
          - DeviceName: /dev/sda1 # root volume on Ubuntu HVM AMIs
            Ebs:
              VolumeSize: !Ref RootVolumeGb
              VolumeType: gp3
              DeleteOnTermination: true
              Encrypted: true
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required # IMDSv2 only
          HttpPutResponseHopLimit: 2
        TagSpecifications: !If
          - IsEphemeral
          # The broker's RunInstances also sends canopy:capability, canopy:owner
          # and canopy:lease (BrokerPolicy requires the first two on the request).
          - - ResourceType: instance
              Tags:
                - { Key: "canopy:capability", Value: !Ref Capability }
                - { Key: "canopy:owner", Value: !Ref Owner }
                - { Key: owner, Value: !Ref OwnerTag }
                - { Key: capability, Value: !Ref Capability }
                - { Key: managed-by, Value: canopy-capabilities }
                - { Key: Name, Value: !Sub "canopy-cap-${Owner}-${Capability}" }
            - ResourceType: volume
              Tags:
                - { Key: "canopy:capability", Value: !Ref Capability }
                - { Key: "canopy:owner", Value: !Ref Owner }
                - { Key: owner, Value: !Ref OwnerTag }
                - { Key: capability, Value: !Ref Capability }
                - { Key: managed-by, Value: canopy-capabilities }
                - { Key: Name, Value: !Sub "canopy-cap-${Owner}-${Capability}-root" }
          - - ResourceType: volume
              Tags:
                - { Key: owner, Value: !Ref OwnerTag }
                - { Key: capability, Value: !Ref Capability }
                - { Key: managed-by, Value: cloudformation }
                - { Key: Name, Value: !Sub "ondemand-${Capability}-root" }

  # Retained: a stack delete must never take the runner (and its disk) with it.
  Instance:
    Type: AWS::EC2::Instance
    Condition: IsPersistent
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        # CloudFormation rejects "$Latest"/"$Default" here ("does not support
        # using $Latest or $Default for LaunchTemplate version"), so pin the
        # number. Consequence: a launch-template edit REPLACES the instance (new
        # id; the old one is retained), and the consumer's instance-id setting
        # must be updated.
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      SubnetId: !Ref SubnetId
      # `capability` is what ConsumerPolicy keys on: change it and the consumer
      # loses the right to start, stop or command this instance.
      Tags:
        - { Key: owner, Value: !Ref OwnerTag }
        - { Key: capability, Value: !Ref Capability }
        - { Key: managed-by, Value: cloudformation }
        - { Key: Name, Value: !Sub "ondemand-${Capability}" }

  # Captured run artifacts. Objects expire after 7 days; the bucket itself is
  # retained. Its name is generated, so a redeploy never collides with a
  # retained bucket; read it from the ArtifactsBucketName output.
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # Only per-request traffic expires. Anything else (worker files, caches)
      # is durable: expiring it would break a reinstall or a replaced instance.
      # Ephemeral: everything is per-lease (leases/) or per-instance (vm/).
      LifecycleConfiguration:
        Rules: !If
          - IsEphemeral
          - - Id: expire-leases-after-7-days
              Status: Enabled
              Prefix: leases/
              ExpirationInDays: 7
            - Id: expire-vm-after-7-days
              Status: Enabled
              Prefix: vm/
              ExpirationInDays: 7
            - Id: abort-incomplete-multipart
              Status: Enabled
              AbortIncompleteMultipartUpload:
                DaysAfterInitiation: 1
          - - Id: expire-requests-after-7-days
              Status: Enabled
              Prefix: requests/
              ExpirationInDays: 7
            - Id: expire-results-after-7-days
              Status: Enabled
              Prefix: results/
              ExpirationInDays: 7
            - Id: abort-incomplete-multipart
              Status: Enabled
              AbortIncompleteMultipartUpload:
                DaysAfterInitiation: 1
      Tags:
        - { Key: owner, Value: !Ref OwnerTag }
        - { Key: capability, Value: !Ref Capability }
        - { Key: managed-by, Value: cloudformation }

  # Layer 3: stop the instance after IdleStopMinutes consecutive 1-minute periods of max CPU
  # below 5% (Maximum, so a single spike resets the window). The action is the
  # AWS-builtin EC2 stop action: no Lambda or SNS in the loop.
  IdleStopAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsPersistent
    Properties:
      AlarmName: !Sub "ondemand-${Capability}-idle-stop"
      AlarmDescription: !Sub "Stop the ${Capability} on-demand runner after ${IdleStopMinutes} min of <5% CPU."
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: !Ref IdleStopMinutes
      Threshold: 5
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: InstanceId
          Value: !Ref Instance
      AlarmActions:
        - !Sub "arn:aws:automate:${AWS::Region}:ec2:stop"
      Tags:
        - { Key: owner, Value: !Ref OwnerTag }
        - { Key: capability, Value: !Ref Capability }
        - { Key: managed-by, Value: cloudformation }

  # What the consumer (OnDemandInstance, run_command) needs, attached to the
  # consumer's own role. Every mutating EC2/SSM statement is scoped by the
  # instance's `capability` tag, so it reaches this capability's runner and
  # nothing else. The Describe calls and GetCommandInvocation take no resource
  # conditions and are read-only; the SSM document carries no tags.
  ConsumerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: IsPersistent
    Properties:
      ManagedPolicyName: !Sub "ondemand-${Capability}-consumer"
      Description: !Sub "Lets the consumer start, stop and command the ${Capability} on-demand runner."
      Roles:
        - !Ref ConsumerTaskRoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EC2LifecycleScopedByCapabilityTag
            Effect: Allow
            Action: [ec2:StartInstances, ec2:StopInstances]
            Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
            Condition:
              StringEquals: { "aws:ResourceTag/capability": !Ref Capability }
          - Sid: EC2Describe
            Effect: Allow
            Action: [ec2:DescribeInstances, ec2:DescribeInstanceStatus]
            Resource: "*"
          - Sid: SSMSendCommandScopedByCapabilityTag
            Effect: Allow
            Action: [ssm:SendCommand]
            Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
            Condition:
              StringEquals: { "aws:ResourceTag/capability": !Ref Capability }
          - Sid: SSMSendCommandDocument
            Effect: Allow
            Action: [ssm:SendCommand]
            Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript"
          - Sid: SSMReadCommandResults
            Effect: Allow
            Action: [ssm:GetCommandInvocation]
            Resource: "*"
          - Sid: S3ListArtifacts
            Effect: Allow
            Action: [s3:ListBucket, s3:GetBucketLocation]
            Resource: !GetAtt ArtifactsBucket.Arn
          - Sid: S3GetArtifacts
            Effect: Allow
            Action: [s3:GetObject]
            Resource: !Sub "${ArtifactsBucket.Arn}/*"
          - Sid: S3PutRequests
            Effect: Allow
            Action: [s3:PutObject]
            Resource: !Sub "${ArtifactsBucket.Arn}/requests/*"

  # Everything the broker (canopy-web) may do, attached to the broker's own
  # role: launch from THIS launch template only, with this capability's and
  # owner's tags on the request; terminate and command only instances carrying
  # both tags; pass only this stack's instance role; read and write only this
  # stack's bucket; read only this stack. Describe and GetCommandInvocation take
  # no resource conditions and are read-only.
  BrokerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: IsEphemeral
    Properties:
      Description: !Sub "Lets the canopy capability broker lease ${Owner}'s ${Capability} instances."
      Roles:
        - !Ref BrokerRoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RunFromThisLaunchTemplate
            Effect: Allow
            Action: [ec2:RunInstances]
            Resource:
              - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${LaunchTemplate}"
              - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*"
              - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*"
              - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*"
              - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*"
              - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}::image/*"
            Condition:
              ArnLike:
                "ec2:LaunchTemplate": !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${LaunchTemplate}"
          - Sid: RunTaggedInstancesFromThisLaunchTemplate
            Effect: Allow
            Action: [ec2:RunInstances]
            Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
            Condition:
              ArnLike:
                "ec2:LaunchTemplate": !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${LaunchTemplate}"
              StringEquals:
                "aws:RequestTag/canopy:capability": !Ref Capability
                "aws:RequestTag/canopy:owner": !Ref Owner
          # The launch template's ImageId is `resolve:ssm:` — EC2 resolves it AS
          # THE CALLER of RunInstances, so the broker needs read on that one
          # parameter or every launch fails with SsmAccessDenied (first live
          # lease, 2026-10-14).
          - Sid: ResolveTheAmiParameter
            Effect: Allow
            Action: [ssm:GetParameters, ssm:GetParameter]
            Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/canopy/capabilities/${Owner}/${Capability}/ami"
          - Sid: TagOnLaunchOnly
            Effect: Allow
            Action: [ec2:CreateTags]
            Resource:
              - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
              - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*"
              - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*"
            Condition:
              StringEquals:
                "ec2:CreateAction": RunInstances
          - Sid: TerminateTaggedInstances
            Effect: Allow
            Action: [ec2:TerminateInstances]
            Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
            Condition:
              StringEquals:
                "aws:ResourceTag/canopy:capability": !Ref Capability
                "aws:ResourceTag/canopy:owner": !Ref Owner
          - Sid: EC2Describe
            Effect: Allow
            Action: [ec2:DescribeInstances, ec2:DescribeInstanceStatus]
            Resource: "*"
          - Sid: SSMSendCommandToTaggedInstances
            Effect: Allow
            Action: [ssm:SendCommand]
            Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
            Condition:
              StringEquals:
                "aws:ResourceTag/canopy:capability": !Ref Capability
                "aws:ResourceTag/canopy:owner": !Ref Owner
          # Only the stack's own exec document — never AWS-RunShellScript — so
          # the broker's role can run nothing on these machines but an argv
          # whose argv[0] is on ExecAllow.
          - Sid: SSMSendCommandExecDocumentOnly
            Effect: Allow
            Action: [ssm:SendCommand]
            Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:document/${ExecDocument}"
          - Sid: SSMReadCommandResults
            Effect: Allow
            Action: [ssm:GetCommandInvocation]
            Resource: "*"
          - Sid: PassTheInstanceRoleToEC2
            Effect: Allow
            Action: [iam:PassRole]
            Resource: !GetAtt InstanceRole.Arn
            Condition:
              StringEquals:
                "iam:PassedToService": ec2.amazonaws.com
          - Sid: S3Bucket
            Effect: Allow
            Action: [s3:ListBucket, s3:GetBucketLocation]
            Resource: !GetAtt ArtifactsBucket.Arn
          - Sid: S3Objects
            Effect: Allow
            Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:AbortMultipartUpload]
            Resource: !Sub "${ArtifactsBucket.Arn}/*"
          - Sid: ReadThisStack
            Effect: Allow
            Action: [cloudformation:DescribeStacks]
            Resource: !Ref "AWS::StackId"

  # The only command document the broker may send (BrokerPolicy). It takes the
  # argv base64-encoded (each argument NUL-terminated), so no argument is ever
  # substituted into the script as text, and runs it only if argv[0] is
  # exactly one of ExecAllow. The lease's paths arrive as parameters whose
  # allowedPatterns exclude every shell metacharacter. A NewVersion update
  # keeps the name, so BrokerPolicy and the broker's stored output stay valid;
  # the broker sends DocumentVersion $LATEST.
  ExecDocument:
    Type: AWS::SSM::Document
    Condition: IsEphemeral
    Properties:
      Name: !Sub "canopy-cap-${Owner}-${Capability}-exec"
      DocumentType: Command
      UpdateMethod: NewVersion
      Content:
        schemaVersion: "2.2"
        description: !Sub "Run one allow-listed command on a ${Capability} lease machine (canopy capability exec)."
        parameters:
          Argv:
            type: String
            description: The argv, base64-encoded, each argument NUL-terminated.
            allowedPattern: "^[A-Za-z0-9+/]+={0,2}$"
          LeaseId:
            type: String
            description: CANOPY_LEASE_ID.
            allowedPattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          LeaseIn:
            type: String
            description: CANOPY_LEASE_IN, the lease's staged inputs (an s3:// prefix).
            allowedPattern: "^s3://[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]/[A-Za-z0-9:._/-]*$"
          LeaseOut:
            type: String
            description: CANOPY_LEASE_OUT, where the command writes artifacts (an s3:// prefix).
            allowedPattern: "^s3://[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]/[A-Za-z0-9:._/-]*$"
          ExecutionTimeout:
            type: String
            description: Seconds the command may run.
            default: "3600"
            allowedPattern: "^[0-9]{1,6}$"
        mainSteps:
          - action: aws:runShellScript
            name: exec
            inputs:
              timeoutSeconds: "{{ ExecutionTimeout }}"
              # The agent runs this with /bin/sh; the body needs bash (read -d ''),
              # so it is handed to bash whole. No ${...} in it: CloudFormation's
              # Sub would take it. {{ }} is SSM's own substitution, of values the
              # allowedPatterns above have already restricted.
              runCommand:
                - !Sub
                  - |
                    canopy_exec=$(cat <<'CANOPY_EXEC'
                    set -eu
                    allow="${Allow}"
                    argv_file=$(mktemp)
                    trap 'rm -f "$argv_file"' EXIT
                    printf '%s' '{{ Argv }}' | base64 -d > "$argv_file"
                    set --
                    while IFS= read -r -d '' arg; do set -- "$@" "$arg"; done < "$argv_file"
                    rm -f "$argv_file"
                    trap - EXIT
                    if [ "$#" -lt 1 ]; then echo "canopy exec: empty argv" >&2; exit 126; fi
                    ok=""
                    for name in $allow; do if [ "$name" = "$1" ]; then ok=1; fi; done
                    if [ -z "$ok" ]; then
                      echo "canopy exec: '$1' is not on this capability's exec allow list ($allow)" >&2
                      exit 126
                    fi
                    export CANOPY_LEASE_ID='{{ LeaseId }}'
                    export CANOPY_LEASE_IN='{{ LeaseIn }}'
                    export CANOPY_LEASE_OUT='{{ LeaseOut }}'
                    exec "$@"
                    CANOPY_EXEC
                    )
                    exec /bin/bash -c "$canopy_exec"
                  - Allow: !Join [" ", !Split [",", !Ref ExecAllow]]
      Tags:
        - { Key: owner, Value: !Ref OwnerTag }
        - { Key: capability, Value: !Ref Capability }
        - { Key: managed-by, Value: cloudformation }

  # The backstop that does not depend on the broker: every 5 minutes, terminate
  # any instance tagged with this capability and owner that has lived longer
  # than MaxInstanceLifetimeSeconds. It covers canopy-web being down, deleted,
  # or wrong — a lease the broker forgot, a launch it never recorded, a sweep
  # that stopped running. Its role can describe instances and terminate only
  # this capability's and owner's.
  BackstopLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsEphemeral
    Properties:
      RetentionInDays: 30

  BackstopRole:
    Type: AWS::IAM::Role
    Condition: IsEphemeral
    Properties:
      Description: !Sub "Terminates ${Owner}'s ${Capability} instances older than MaxInstanceLifetimeSeconds."
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref "AWS::AccountId"
      Policies:
        - PolicyName: terminate-overdue
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Describe
                Effect: Allow
                Action: [ec2:DescribeInstances]
                Resource: "*"
              - Sid: TerminateThisCapabilitysInstances
                Effect: Allow
                Action: [ec2:TerminateInstances]
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    "aws:ResourceTag/canopy:capability": !Ref Capability
                    "aws:ResourceTag/canopy:owner": !Ref Owner
              - Sid: WriteItsOwnLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt BackstopLogGroup.Arn
      Tags:
        - { Key: owner, Value: !Ref OwnerTag }
        - { Key: capability, Value: !Ref Capability }
        - { Key: managed-by, Value: cloudformation }

  BackstopFunction:
    Type: AWS::Lambda::Function
    Condition: IsEphemeral
    Properties:
      Description: !Sub "Backstop: terminate ${Owner}'s ${Capability} instances older than ${MaxInstanceLifetimeSeconds}s."
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      MemorySize: 128
      Role: !GetAtt BackstopRole.Arn
      LoggingConfig:
        LogGroup: !Ref BackstopLogGroup
        LogFormat: Text
      Environment:
        Variables:
          CAPABILITY: !Ref Capability
          OWNER: !Ref Owner
          MAX_INSTANCE_LIFETIME_S: !Ref MaxInstanceLifetimeSeconds
      Code:
        ZipFile: |
          """Terminate this capability's instances that have outlived MAX_INSTANCE_LIFETIME_S."""
          import datetime
          import json
          import os

          import boto3

          LIVE = ["pending", "running", "stopping", "stopped"]


          def overdue(instances, now, max_s):
              return sorted(i["InstanceId"] for i in instances
                            if (now - i["LaunchTime"]).total_seconds() > max_s)


          def handler(event, context, ec2=None):
              ec2 = ec2 or boto3.client("ec2")
              max_s = int(os.environ["MAX_INSTANCE_LIFETIME_S"])
              filters = [
                  {"Name": "tag:canopy:capability", "Values": [os.environ["CAPABILITY"]]},
                  {"Name": "tag:canopy:owner", "Values": [os.environ["OWNER"]]},
                  {"Name": "instance-state-name", "Values": LIVE},
              ]
              instances = []
              for page in ec2.get_paginator("describe_instances").paginate(Filters=filters):
                  for res in page.get("Reservations", []):
                      instances.extend(res.get("Instances", []))
              now = datetime.datetime.now(datetime.timezone.utc)
              ids = overdue(instances, now, max_s)
              for start in range(0, len(ids), 500):
                  ec2.terminate_instances(InstanceIds=ids[start:start + 500])
              print(json.dumps({"checked": len(instances), "terminated": ids, "max_s": max_s}))
              return {"checked": len(instances), "terminated": ids}
      Tags:
        - { Key: owner, Value: !Ref OwnerTag }
        - { Key: capability, Value: !Ref Capability }
        - { Key: managed-by, Value: cloudformation }

  BackstopSchedule:
    Type: AWS::Events::Rule
    Condition: IsEphemeral
    Properties:
      Description: !Sub "Every 5 minutes: the ${Capability} capability's lifetime backstop."
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Id: backstop
          Arn: !GetAtt BackstopFunction.Arn

  BackstopInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: IsEphemeral
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref BackstopFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt BackstopSchedule.Arn

Outputs:
  InstanceId:
    Condition: IsPersistent
    Description: The runner's instance id (the consumer's OnDemandInstance(instance_id=...)).
    Value: !Ref Instance
  ArtifactsBucketName:
    Description: The artifacts bucket the instance uploads to and the consumer reads from.
    Value: !Ref ArtifactsBucket
  LaunchTemplateId:
    Condition: IsEphemeral
    Description: The launch template the broker launches one instance per lease from.
    Value: !Ref LaunchTemplate
  InstanceRoleArn:
    Condition: IsEphemeral
    Description: The instances' role (what the broker passes at launch).
    Value: !GetAtt InstanceRole.Arn
  InstanceRoleId:
    Condition: IsEphemeral
    Description: >-
      The instances' role id. An instance's S3 prefix is vm/<InstanceRoleId>:<instance-id>/
      (its aws:userid), so this is how the broker finds ready.json.
    Value: !GetAtt InstanceRole.RoleId
  Capability:
    Condition: IsEphemeral
    Description: The capability's name, as the instances are tagged (canopy:capability).
    Value: !Ref Capability
  Owner:
    Condition: IsEphemeral
    Description: The owning agent's slug, as the instances are tagged (canopy:owner).
    Value: !Ref Owner
  LeaseObjectScope:
    Condition: IsEphemeral
    Description: >-
      Where a lease's objects live. "instance": under the machine's own prefix,
      vm/<InstanceRoleId>:<instance-id>/lease/<lease-id>/{in,out,exec}/, the only
      place its role may read or write. (Stacks before 0.9.0 have no such output:
      leases/<lease-id>/..., shared by every machine.)
    Value: instance
  ExecDocumentName:
    Condition: IsEphemeral
    Description: The one command document the broker may send (runs only an ExecAllow argv[0]).
    Value: !Ref ExecDocument
  ExecAllow:
    Condition: IsEphemeral
    Description: The commands the exec document will run, comma-separated.
    Value: !Ref ExecAllow
  MaxInstanceLifetimeSeconds:
    Condition: IsEphemeral
    Description: The backstop terminates any of this capability's instances older than this.
    Value: !Ref MaxInstanceLifetimeSeconds
  BackstopFunctionName:
    Condition: IsEphemeral
    Description: The scheduled Lambda that enforces MaxInstanceLifetimeSeconds.
    Value: !Ref BackstopFunction
