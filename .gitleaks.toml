# gitleaks config for the CI secret scan (ci.yml → "Secret scan (PR diff)").
#
# The default ruleset, plus two narrow allowlists for what is KNOWN to be fake.
# Keep them narrow: an allowlisted path is a place a real secret can hide.
title = "canopy-web"

[extend]
useDefault = true

# canopy's own bearer tokens, by prefix (apps/tokens/models.py `PREFIX`,
# apps/harness: crt_/cct_, apps/canopy_sessions/chat_keys.py: chk_,
# apps/contacts/hcp_oauth.py: hcpat_/hcprt_). The random part is
# `secrets.token_urlsafe(32)` — 43 base64url characters.
[[rules]]
id = "canopy-token"
description = "canopy-web bearer token (personal, delegated, contact, caller, runner, chat key, HCP)"
regex = '''\b(?:cpat|cdt|ccon|cct|crt|chk|hcpat|hcprt)_[A-Za-z0-9_-]{40,}'''
entropy = 3.5
keywords = ["cpat_", "cdt_", "ccon_", "cct_", "crt_", "chk_", "hcpat_", "hcprt_"]

# Deliberately fake secrets — the redaction tests feed a GitHub PAT, a JWT and a
# PEM private key to the scrubber to prove it removes them. They have to look
# real, so every specific rule fires on them.
[[allowlists]]
description = "Fake secrets that the session-transcript redaction tests scrub"
paths = ['''^apps/session_sharing/tests/test_redact\.py$''']

# `generic-api-key` is a keyword-plus-entropy heuristic, and in this repo it
# fires on identifiers, not credentials: `idempotency_key="..."`,
# `session_key="..."`, and migration dependency tuples like
# `("tokens", "0016_delegated_assurance")`. Silenced for THAT rule only, and only
# in tests, migrations and docs — every specific rule (GitHub, AWS, Slack,
# Anthropic, private keys, …) still applies there.
[[allowlists]]
description = "generic-api-key false positives on *_key= identifiers in tests, migrations and docs"
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)tests?/''',
  '''(^|/)test_[^/]*\.py$''',
  '''\.test\.tsx?$''',
  '''(^|/)migrations/''',
  '''^docs/''',
]
