AWSTemplateFormatVersion: "2010-09-09"
Description: >
  canopy-web as the third tenant on the connect-labs platform
  (labs.connect.dimagi.com/canopy). Creates canopy's own ECR repo, log group,
  secrets, ALB target group + /canopy/* listener rule, ECS task definition, and
  Fargate service. References the SHARED platform resources (VPC, subnets, SG,
  ECS cluster, ALB HTTPS listener, IAM roles) by parameter — defaults are the
  live connect-labs values discovered in account 858923557655 / us-east-1.

  canopy-web is a single-container monolith (uvicorn serves the SPA + Django API
  + MCP + websockets on :8000), so this is ONE container / ONE ECR repo — unlike
  ace-web's 2-container (api + nginx) split.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-024df4c7bcc30cb01
  Subnets:
    Type: List<AWS::EC2::Subnet::Id>
    Default: "subnet-06646effb09be2f42,subnet-08a18eb47b48aff54"
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup::Id
    Default: sg-0666a5ed512c97d9d
  ClusterName:
    Type: String
    Default: labs-jj-cluster
  HttpsListenerArn:
    Type: String
    Default: arn:aws:elasticloadbalancing:us-east-1:858923557655:listener/app/labs-jj-alb/ffecbe258260c7ee/95873265402e7831
  ExecutionRoleArn:
    Type: String
    Default: arn:aws:iam::858923557655:role/labs-jj-ecs-task-execution-role
  TaskRoleArn:
    Type: String
    Default: arn:aws:iam::858923557655:role/labs-jj-ecs-task-role
  ContainerPort:
    Type: Number
    Default: 8000
  ImageTag:
    Type: String
    Default: latest
  DesiredCount:
    Type: Number
    Default: 0
    Description: >
      Start at 0 so the stack creates cleanly before secrets + image exist. Set
      secret values + push the image, then update the stack with DesiredCount=1.

Resources:
  EcrRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: labs-jj-canopy-web
      ImageScanningConfiguration: { ScanOnPush: true }

  # Chat attachment bytes (apps/canopy_sessions). Private: nothing is ever served
  # from S3 directly — the Django app streams the bytes so one place enforces
  # "is this session yours to read", and there is no CORS rule or presigned-URL
  # expiry to reason about.
  AttachmentsBucket:
    Type: AWS::S3::Bucket
    # Retain on stack delete/replace. This holds user data: a stack teardown
    # must not take screenshots with it, and CloudFormation cannot delete a
    # non-empty bucket anyway — it would just fail the teardown noisily. Losing
    # the bucket is the only unrecoverable mistake available here.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # Literal, not !Sub: the SAME name is repeated as the container's
      # CANOPY_ATTACHMENTS_BUCKET env value below, and that one MUST be a plain
      # string (deploy/aws/render_taskdef.py reads this template outside
      # CloudFormation and drops any env var whose value is an intrinsic).
      # Keep the two in sync; render_taskdef's REQUIRED_ENV guard fails the
      # deploy loudly if the env one ever goes missing.
      BucketName: labs-jj-canopy-web-attachments-858923557655
      # Nothing in this bucket is ever public. The app streams every byte itself
      # (see apps/canopy_sessions/attachment_storage.py), so there is no reason
      # for anonymous or cross-account access to exist at all.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # ACLs off entirely. With PublicAccessBlock alone, ACLs still FUNCTION —
      # they are merely prevented from granting public access. BucketOwnerEnforced
      # removes the mechanism, so per-object ACLs cannot grant anything to anyone
      # and the bucket policy is the single, auditable authority.
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          # Hygiene only, never expiry: a failed multipart upload otherwise
          # leaves parts that are billed forever and are invisible in a listing.
          # No object-expiry rule on purpose — attachment retention follows
          # session retention, which is an open product decision.
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }

  # Access is granted by a BUCKET policy rather than an IAM policy on the task
  # role, because that role belongs to the shared labs platform and reaches this
  # stack only as the TaskRoleArn *parameter* — we cannot attach to a role we do
  # not own. A resource policy gets us there with no change to the shared stack
  # and no coordination with whoever owns it.
  AttachmentsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AttachmentsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { AWS: !Ref TaskRoleArn }
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:DeleteObject
            Resource: !Sub "${AttachmentsBucket.Arn}/*"
          # Refuse anything not over TLS, from anyone including the task role.
          # A Deny with Principal "*" does not make the policy "public" (only
          # Allow does), so BlockPublicPolicy accepts it.
          - Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt AttachmentsBucket.Arn
              - !Sub "${AttachmentsBucket.Arn}/*"
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/labs-jj-canopy-web
      RetentionInDays: 30

  # --- Secrets (containers; real values are set out-of-band via
  #     `aws secretsmanager put-secret-value` before DesiredCount is raised) ---
  DjangoSecretKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: canopy-web/django-secret-key
      GenerateSecretString: { PasswordLength: 64, ExcludePunctuation: true }

  DatabaseUrl:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: canopy-web/database-url
      SecretString: "postgres://PLACEHOLDER@labs-jj-postgres.cs74wyie8cdf.us-east-1.rds.amazonaws.com:5432/canopy_web"

  RedisUrl:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: canopy-web/redis-url
      SecretString: "redis://labs-jj-redis.aceivh.0001.use1.cache.amazonaws.com:6379/1"

  GoogleOauthClientId:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: canopy-web/google-oauth-client-id
      SecretString: "PLACEHOLDER"

  GoogleOauthClientSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: canopy-web/google-oauth-client-secret
      SecretString: "PLACEHOLDER"

  DriveSaKeyJson:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: canopy-web/drive-sa-key-json
      SecretString: "PLACEHOLDER"

  VapidPrivateKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: canopy-web/vapid-private-key
      SecretString: "PLACEHOLDER"

  # --- ALB target group + /canopy/* rule (slots in at a free priority
  #     alongside ace's /ace/* at prio 20 and the connect-labs default) ---
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: labs-jj-canopy-web-tg
      VpcId: !Ref VpcId
      Port: !Ref ContainerPort
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /canopy/health/
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      Matcher: { HttpCode: "200" }

  ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListenerArn
      Priority: 30
      Conditions:
        - Field: path-pattern
          Values: ["/canopy/*"]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: labs-jj-canopy-web
      Cpu: "1024"
      Memory: "2048"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !Ref ExecutionRoleArn
      TaskRoleArn: !Ref TaskRoleArn
      ContainerDefinitions:
        - Name: canopy-web
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/labs-jj-canopy-web:${ImageTag}"
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
          Environment:
            - { Name: DJANGO_SETTINGS_MODULE, Value: config.settings.connectlabs }
            - { Name: FORCE_SCRIPT_NAME, Value: /canopy }
            - { Name: ALLOWED_HOSTS, Value: labs.connect.dimagi.com }
            # OAuth login allowlist (comma-separated). This Environment block is
            # the SINGLE source of truth for the container's non-secret env: every
            # deploy re-asserts it onto the live task def via render_taskdef.py, so
            # editing it here (and merging to main) is what changes the running
            # value — no separate stack update needed. Keep in sync with
            # .env.example. Without this entry the container falls back to the
            # base.py default of just `dimagi.com`, locking out dimagi-associate.com
            # / dimagi-ai.com logins.
            - { Name: AUTH_ALLOWED_EMAIL_DOMAIN, Value: "dimagi.com,dimagi-ai.com,dimagi-associate.com" }
            - { Name: AWS_REGION, Value: !Ref "AWS::Region" }
            - { Name: PORT, Value: !Ref ContainerPort }
            # Google Drive root folder for walkthrough storage. Not a secret
            # (folder ID isn't sensitive) — plain env var, matching the retired
            # GCP deploy. The matching SA key is the CANOPY_DRIVE_SA_KEY_JSON
            # secret below.
            - { Name: CANOPY_DRIVE_ROOT_FOLDER_ID, Value: 1cUv7wQXOvVwuZ86PdhkxpFcuB4Lm9fPz }
            - { Name: CANOPY_ATTACHMENTS_BUCKET, Value: labs-jj-canopy-web-attachments-858923557655 }
            # Web Push (VAPID). The public key is not a secret — it ships in the
            # JS bundle so the browser can subscribe with it; it is the other
            # half of the VapidPrivateKey secret below and the two must match.
            - { Name: VAPID_PUBLIC_KEY, Value: "BI34-mR1N-xMAhF3tQ1ajAe7g9KaK1nlrhX49pRQmBgo5s-KgoTtgcfOz9ejYeeAJR-tQh9JZ1cRJUCb8td-W58" }
            - { Name: VAPID_SUBJECT, Value: mailto:jjackson@dimagi.com }
          Secrets:
            # Name MUST be SECRET_KEY — that's what config/settings/base.py reads.
            # (It was DJANGO_SECRET_KEY, which nothing read, so prod silently fell
            # back to the insecure dev default; production.py now hard-fails on that.)
            - { Name: SECRET_KEY, ValueFrom: !Ref DjangoSecretKey }
            - { Name: DATABASE_URL, ValueFrom: !Ref DatabaseUrl }
            - { Name: REDIS_URL, ValueFrom: !Ref RedisUrl }
            - { Name: GOOGLE_OAUTH_CLIENT_ID, ValueFrom: !Ref GoogleOauthClientId }
            - { Name: GOOGLE_OAUTH_CLIENT_SECRET, ValueFrom: !Ref GoogleOauthClientSecret }
            - { Name: CANOPY_DRIVE_SA_KEY_JSON, ValueFrom: !Ref DriveSaKeyJson }
            - { Name: VAPID_PRIVATE_KEY, ValueFrom: !Ref VapidPrivateKey }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: canopy-web

  Service:
    Type: AWS::ECS::Service
    DependsOn: ListenerRule
    Properties:
      ServiceName: labs-jj-canopy-web
      Cluster: !Ref ClusterName
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref Subnets
          SecurityGroups: [!Ref SecurityGroup]
          AssignPublicIp: ENABLED
      LoadBalancers:
        - TargetGroupArn: !Ref TargetGroup
          ContainerName: canopy-web
          ContainerPort: !Ref ContainerPort

Outputs:
  EcrRepoUri:
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/labs-jj-canopy-web"
  Url:
    Value: https://labs.connect.dimagi.com/canopy/
  ServiceName:
    Value: !Ref Service
