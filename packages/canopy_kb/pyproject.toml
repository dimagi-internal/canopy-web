[project]
name = "canopy-kb"
version = "0.2.0"
description = "Knowledge bases: build a cited library from a curator's bundle, query it, and describe it as MCP tools (stdlib only; served per workspace project by canopy-web), plus the curator's toolkit (canopy_kb.prep, extra [prep])."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# canopy_kb.prep, the curator's toolkit (fetch, read each format, OCR, cards); the engine needs none.
prep = ["httpx>=0.27", "requests>=2.31", "beautifulsoup4>=4.12", "lxml>=5", "markdownify>=0.13",
        "pymupdf>=1.24", "openpyxl>=3.1", "xlrd>=2.0", "python-docx>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["canopy_kb"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
