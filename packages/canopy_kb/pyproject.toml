[project]
name = "canopy-kb"
version = "0.1.0"
description = "Knowledge bases: build a cited library from a curator's bundle, query it, and describe it as MCP tools. Stdlib only; served per workspace project by canopy-web."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["canopy_kb"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
