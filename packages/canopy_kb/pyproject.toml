[project]
name = "canopy-kb"
version = "0.2.0"
description = "Knowledge bases: build a cited library from a curator's bundle, query it, and describe it as MCP tools (stdlib only; served per workspace project by canopy-web), plus the curator's toolkit (canopy_kb.prep, extra [prep])."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# canopy_kb.prep, the curator's toolkit (fetch, read each format, OCR, cards); the engine needs none.
# The readers are pinned: a step result is keyed by the code that made it, and a reader
# library is part of that code (prep/steps.lock records their versions; a refresh refuses
# to run on others until a curator relocks, bumping a reader's REVISION if output moves).
prep = ["httpx>=0.27", "requests>=2.31", "beautifulsoup4==4.15.0", "lxml==6.1.3", "markdownify==1.2.3",
        "pymupdf==2.0", "openpyxl==3.1.5", "xlrd==2.0.2", "python-docx==1.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["canopy_kb"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
