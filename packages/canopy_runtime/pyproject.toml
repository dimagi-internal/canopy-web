[project]
name = "canopy-runtime"
version = "0.5.0"
description = "Django-free schema for an agent's capability manifests (capability.yaml), and `canopy-runtime publish-capabilities`, which validates them and sends them to canopy-web."
readme = "README.md"
requires-python = ">=3.11"
# pydantic for validation; pyyaml to load capability.yaml straight from the agent's repo. Deliberately NOT depending on Django — an agent's deploy
# imports this to publish capabilities without installing canopy-web.
dependencies = [
    "pydantic>=2.6,<3.0",
    "pyyaml>=6.0,<7.0",
]

[project.scripts]
# `canopy-runtime publish-capabilities --dir infra/capabilities --agent <slug>`.
canopy-runtime = "canopy_runtime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["canopy_runtime"]

[tool.pytest.ini_options]
# Plain pytest — no pytest-django, no DB. The package resolves via editable install.
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
