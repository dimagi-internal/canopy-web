[project]
name = "canopy-transcript"
version = "0.1.0"
description = "Django-free Claude Code transcript core: path resolution, incremental tailing, block-to-row extraction with composite ordinals, and byte-bounded batching. Shared by canopy-web's server and both runners."
readme = "README.md"
requires-python = ">=3.11"
# Deliberately dependency-free (stdlib only). Both runners import it, and one of
# them ships to an EC2 box as a single file plus this package — every dependency
# added here is a dependency that box has to resolve at boot.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["canopy_transcript"]

[tool.pytest.ini_options]
# Plain pytest — no pytest-django, no DB. The package resolves via the editable
# install, same as canopy_cron.
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
